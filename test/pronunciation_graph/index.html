<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเปรียบเทียบการออกเสียง (Static Waveform)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #f0f4f8;
            font-family: 'Sarabun', sans-serif;
            min-height: 100vh;
            padding: 30px 15px;
        }
        .app-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 30px;
            max-width: 900px;
            margin: 0 auto;
        }
        .word-carousel-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }
        .carousel-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s ease;
        }
        .word-display {
            font-size: 3rem;
            font-weight: bold;
            color: #2c3e50;
            min-width: 250px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        canvas {
            width: 100%;
            height: 140px;
            background-color: #1e272e;
            border-radius: 12px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.2);
        }
        .mic-btn {
            width: 100px;
            height: 100px;
            font-size: 2.5rem;
            border-radius: 50%;
            background-color: #ff4757;
            color: white;
            border: none;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
            transition: all 0.3s ease;
        }
        .mic-btn:hover {
            transform: scale(1.08);
            background-color: #ff6b81;
        }
        .mic-btn.recording {
            background-color: #2ed573;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 213, 115, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(46, 213, 115, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 213, 115, 0); }
        }
        .score-badge {
            font-size: 2.2rem;
            font-weight: bold;
            border-radius: 50px;
            padding: 10px 30px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="app-card text-center">
    <h2 class="text-primary fw-bold mb-3">🎯 ระบบฝึกและเปรียบเทียบการออกเสียง</h2>
    
    <!-- Carousel สลับคำศัพท์ -->
    <div class="word-carousel-container">
        <button id="prevBtn" class="btn btn-outline-primary carousel-btn">
            <i class="fas fa-chevron-left"></i>
        </button>
        <div id="wordDisplay" class="word-display">sawasdee</div>
        <button id="nextBtn" class="btn btn-outline-primary carousel-btn">
            <i class="fas fa-chevron-right"></i>
        </button>
    </div>
    
    <!-- ส่วนแสดงคะแนน -->
    <div id="scoreArea" class="my-3" style="display: none;">
        <span class="text-muted fs-5 d-block mb-1">คะแนนความถูกต้อง</span>
        <div id="scoreBadge" class="score-badge bg-light text-dark">0%</div>
        <p id="scoreFeedback" class="mt-2 fs-5 fw-bold text-secondary"></p>
    </div>

    <!-- กราฟแสดงเสียง 2 ฝั่ง -->
    <div class="row g-3 my-2">
        <!-- ฝั่งเสียงต้นแบบ -->
        <div class="col-md-6">
            <div class="p-3 border rounded-3 bg-light">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 id="refLabel" class="mb-0 text-secondary"><i class="fas fa-volume-up me-1"></i> เสียงต้นแบบ</h6>
                    <button id="playRefBtn" class="btn btn-sm btn-outline-primary">
                        <i class="fas fa-play"></i> ฟังเสียง
                    </button>
                </div>
                <canvas id="refCanvas"></canvas>
            </div>
        </div>
        
        <!-- ฝั่งเสียงผู้ใช้ -->
        <div class="col-md-6">
            <div class="p-3 border rounded-3 bg-light">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="mb-0 text-secondary">
                        <i class="fas fa-user me-1"></i> เสียงของหนู 
                        <span id="userStatus" class="badge bg-secondary ms-1">รอการบันทึก</span>
                    </h6>
                    <button id="playUserBtn" class="btn btn-sm btn-outline-success" disabled>
                        <i class="fas fa-play"></i> ฟังเสียง
                    </button>
                </div>
                <canvas id="userCanvas"></canvas>
            </div>
        </div>
    </div>

    <!-- แท็กเล่นเสียง Hidden -->
    <audio id="refAudio" preload="auto"></audio>
    <audio id="userAudio" preload="auto"></audio>

    <!-- ปุ่มไมโครโฟน -->
    <div class="mt-4">
        <button id="micBtn" class="mic-btn">
            <i class="fas fa-microphone"></i>
        </button>
        <p id="micStatusText" class="mt-3 text-muted fs-5">กดปุ่มไมค์ แล้วพูดตามคำศัพท์ด้านบน (บันทึก 2.5 วินาที)</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/meyda/dist/web/meyda.min.js"></script>

<script>
    const wordFiles = [
        'สวัสดี.mp3',
        'กินอาหาร.mp3',
        'นักเรียน.mp3',
        'บ้าน.mp3',
        'รถยนต์.mp3',
        'ต้นไม้.mp3',
    ];

    let currentWordIndex = 0;
    // const MULTIPLIER = 2.0;
    const RECORD_DURATION = 2500;

    const wordDisplay = document.getElementById('wordDisplay');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const refLabel = document.getElementById('refLabel');

    const refAudio = document.getElementById('refAudio');
    const userAudio = document.getElementById('userAudio');
    const refCanvas = document.getElementById('refCanvas');
    const userCanvas = document.getElementById('userCanvas');
    const refCtx = refCanvas.getContext('2d');
    const userCtx = userCanvas.getContext('2d');
    
    const playRefBtn = document.getElementById('playRefBtn');
    const playUserBtn = document.getElementById('playUserBtn');
    const micBtn = document.getElementById('micBtn');
    const micStatusText = document.getElementById('micStatusText');
    const userStatus = document.getElementById('userStatus');
    const scoreArea = document.getElementById('scoreArea');
    const scoreBadge = document.getElementById('scoreBadge');
    const scoreFeedback = document.getElementById('scoreFeedback');

    let audioCtx;
    let isRecording = false;
    let mediaRecorder;
    let animId;
    let userAudioUrl = null;

    let refMfccFeatures = [];
    let userMfccFeatures = [];

    refCanvas.width = 400;
    refCanvas.height = 140;
    userCanvas.width = 400;
    userCanvas.height = 140;

    drawFlatLine(refCtx, refCanvas);
    drawFlatLine(userCtx, userCanvas);
    loadCurrentWord();

    prevBtn.addEventListener('click', () => {
        currentWordIndex = (currentWordIndex - 1 + wordFiles.length) % wordFiles.length;
        loadCurrentWord();
    });

    nextBtn.addEventListener('click', () => {
        currentWordIndex = (currentWordIndex + 1) % wordFiles.length;
        loadCurrentWord();
    });

    function loadCurrentWord() {
        const fileName = wordFiles[currentWordIndex];
        const wordName = fileName.replace(/\.[^/.]+$/, "");
        
        wordDisplay.innerText = wordName;
        refLabel.innerHTML = `<i class="fas fa-volume-up me-1"></i> เสียงต้นแบบ (${fileName})`;

        stopAllAudio();
        resetUserSession();

        const audioPath = `words/${fileName}`;
        refAudio.src = audioPath;
        loadReferenceAudio(audioPath);
    }

    function resetUserSession() {
        userMfccFeatures = [];
        scoreArea.style.display = "none";
        userStatus.className = "badge bg-secondary ms-1";
        userStatus.innerText = "รอการบันทึก";
        playUserBtn.disabled = true;
        playUserBtn.innerHTML = '<i class="fas fa-play"></i> ฟังเสียง';

        if (userAudioUrl) {
            URL.revokeObjectURL(userAudioUrl);
            userAudioUrl = null;
        }
        userAudio.src = "";
        drawFlatLine(userCtx, userCanvas);
    }

    function stopAllAudio() {
        if (!refAudio.paused) {
            refAudio.pause();
            playRefBtn.innerHTML = '<i class="fas fa-play"></i> ฟังเสียง';
        }
        if (!userAudio.paused) {
            userAudio.pause();
            playUserBtn.innerHTML = '<i class="fas fa-play"></i> ฟังเสียง';
        }
    }

    // --- การเล่นเสียงต้นแบบ ---
    playRefBtn.addEventListener('click', async () => {
        initAudioContext();
        if (!userAudio.paused) {
            userAudio.pause();
            playUserBtn.innerHTML = '<i class="fas fa-play"></i> ฟังเสียง';
        }

        if (refAudio.paused) {
            refAudio.currentTime = 0;
            refAudio.play();
            playRefBtn.innerHTML = '<i class="fas fa-stop"></i> หยุด';
        } else {
            refAudio.pause();
            playRefBtn.innerHTML = '<i class="fas fa-play"></i> ฟังเสียง';
        }
    });

    refAudio.addEventListener('ended', () => {
        playRefBtn.innerHTML = '<i class="fas fa-play"></i> ฟังเสียง';
    });

    // --- การเล่นเสียงของผู้ใช้ ---
    playUserBtn.addEventListener('click', async () => {
        if (!userAudio.src) return;
        initAudioContext();

        if (!refAudio.paused) {
            refAudio.pause();
            playRefBtn.innerHTML = '<i class="fas fa-play"></i> ฟังเสียง';
        }

        if (userAudio.paused) {
            userAudio.currentTime = 0;
            userAudio.play();
            playUserBtn.innerHTML = '<i class="fas fa-stop"></i> หยุด';
        } else {
            userAudio.pause();
            playUserBtn.innerHTML = '<i class="fas fa-play"></i> ฟังเสียง';
        }
    });

    userAudio.addEventListener('ended', () => {
        playUserBtn.innerHTML = '<i class="fas fa-play"></i> ฟังเสียง';
    });

    // --- ปุ่มไมโครโฟน ---
    micBtn.addEventListener('click', async () => {
        if (isRecording) return;
        stopAllAudio();
        await startRecording();
    });

    function initAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    // --- 1. โหลดและสกัด MFCC จากเสียงต้นแบบ ---
    async function loadReferenceAudio(audioPath) {
        try {
            const response = await fetch(audioPath);
            if (!response.ok) throw new Error('File not found');

            const arrayBuffer = await response.arrayBuffer();
            initAudioContext();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            //วาด Static Waveform ของเสียงต้นแบบ (สีฟ้า)
            drawStaticWaveform(refCtx, refCanvas, audioBuffer, '#00d2d3', MULTIPLIER=4.0);
            refMfccFeatures = extractMFCCFromBuffer(audioBuffer);
        } catch (err) {
            console.warn(`ไม่พบไฟล์ ${audioPath}:`, err);
            refMfccFeatures = [];
            drawFlatLine(refCtx, refCanvas);
        }
    }

    // --- 2. การบันทึกเสียงไมโครโฟนของผู้ใช้ ---
    async function startRecording() {
        try {
            initAudioContext();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            
            const chunks = [];
            mediaRecorder = new MediaRecorder(stream);

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) chunks.push(e.data);
            };

            mediaRecorder.onstop = async () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });

                // สร้าง Blob URL เพื่อนำไปเล่นซ้ำใน <audio id="userAudio">
                if (userAudioUrl) URL.revokeObjectURL(userAudioUrl);
                userAudioUrl = URL.createObjectURL(blob);
                userAudio.src = userAudioUrl;
                playUserBtn.disabled = false; // เปิดใช้งานปุ่มฟังเสียงผู้ใช้

                const arrayBuffer = await blob.arrayBuffer();
                
                try {
                    const userAudioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                    
                    // วาด Static Waveform ของผู้ใช้ (สีเขียว)
                    drawStaticWaveform(userCtx, userCanvas, userAudioBuffer, '#2ed573', MULTIPLIER=11.0);

                    // สกัด MFCC และประเมินคะแนน
                    userMfccFeatures = extractMFCCFromBuffer(userAudioBuffer);
                    evaluateSpeech();

                    userStatus.className = "badge bg-success ms-1";
                    userStatus.innerText = "ประมวลผลเสร็จสิ้น";
                } catch (err) {
                    console.error("Error decoding recorded audio:", err);
                    alert("ไม่สามารถประมวลผลไฟล์เสียงที่บันทึกได้ กรุณาลองใหม่อีกครั้ง");
                }
            };

            isRecording = true;
            playUserBtn.disabled = true;
            micBtn.classList.add('recording');
            micBtn.innerHTML = '<i class="fas fa-microphone-alt"></i>';
            userStatus.className = "badge bg-danger ms-1";
            userStatus.innerText = "กำลังอัดเสียง...";
            micStatusText.innerText = `กำลังฟังอยู่... พูดว่า "${wordDisplay.innerText}" เลยจ้า!`;
            scoreArea.style.display = "none";

            drawRecordingProgress();
            mediaRecorder.start();

            setTimeout(() => {
                if (mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                    stream.getTracks().forEach(track => track.stop());
                    cancelAnimationFrame(animId);

                    isRecording = false;
                    micBtn.classList.remove('recording');
                    micBtn.innerHTML = '<i class="fas fa-microphone"></i>';
                    micStatusText.innerText = "กดปุ่มไมค์ เพื่อลองพูดใหม่อีกครั้ง";
                }
            }, RECORD_DURATION);

        } catch (err) {
            alert("กรุณาอนุญาตให้ใช้งานไมโครโฟน");
            console.error(err);
        }
    }

    // --- 3. สกัด MFCC จาก AudioBuffer ---
    function extractMFCCFromBuffer(audioBuffer) {
        const channelData = audioBuffer.getChannelData(0);
        const bufferSize = 512;
        const mfccList = [];

        for (let i = 0; i <= channelData.length - bufferSize; i += bufferSize) {
            const chunk = channelData.subarray(i, i + bufferSize);
            const mfcc = Meyda.extract('mfcc', chunk);
            if (mfcc) mfccList.push(Array.from(mfcc));
        }
        return mfccList;
    }

    // --- 4. อัลกอริทึม DTW และการประเมินคะแนน ---
    function evaluateSpeech() {
        if (userMfccFeatures.length === 0 || refMfccFeatures.length === 0) {
            alert("ไม่สามารถเปรียบเทียบเสียงได้ กรุณาตรวจสอบไฟล์เสียงต้นแบบหรือลองพูดใหม่อีกครั้ง");
            return;
        }

        const dtwDistance = calculateDTW(userMfccFeatures, refMfccFeatures);
        
        let score = Math.round(100 - (dtwDistance * 2.2));
        score = Math.max(10, Math.min(99, score));

        scoreArea.style.display = "block";
        scoreBadge.innerText = `${score}%`;

        if (score >= 80) {
            scoreBadge.className = "score-badge bg-success text-white shadow";
            scoreFeedback.innerText = "🎉 ยอดเยี่ยมมาก! ออกเสียงได้ชัดเจนมากครับ";
        } else if (score >= 60) {
            scoreBadge.className = "score-badge bg-warning text-dark shadow";
            scoreFeedback.innerText = "👍 เกือบเป๊ะแล้ว! ออกเสียงเน้นอีกนิดนะจ๊ะ";
        } else {
            scoreBadge.className = "score-badge bg-danger text-white shadow";
            scoreFeedback.innerText = "💪 พยายามอีกนิด! ลองฟังเสียงต้นแบบแล้วพูดตามใหม่นะ";
        }
    }

    function calculateDTW(seq1, seq2) {
        const n = seq1.length;
        const m = seq2.length;
        
        const dist = (v1, v2) => {
            let sum = 0;
            for (let i = 0; i < 13; i++) {
                sum += Math.pow((v1[i] || 0) - (v2[i] || 0), 2);
            }
            return Math.sqrt(sum);
        };

        const dtw = Array(n + 1).fill(null).map(() => Array(m + 1).fill(Infinity));
        dtw[0][0] = 0;

        for (let i = 1; i <= n; i++) {
            for (let j = 1; j <= m; j++) {
                const cost = dist(seq1[i - 1], seq2[j - 1]);
                dtw[i][j] = cost + Math.min(
                    dtw[i - 1][j],
                    dtw[i][j - 1],
                    dtw[i - 1][j - 1]
                );
            }
        }
        return dtw[n][m] / (n + m);
    }

    // --- 5. ฟังก์ชันวาด Static Waveform ---
    function drawStaticWaveform(ctx, canvas, audioBuffer, strokeColor = '#00d2d3',MULTIPLIER) {
        const rawData = audioBuffer.getChannelData(0);
        const samples = canvas.width;
        const blockSize = Math.floor(rawData.length / samples);

        ctx.fillStyle = '#1e272e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 2;
        ctx.strokeStyle = strokeColor;
        ctx.beginPath();

        const middle = canvas.height / 2;

        for (let i = 0; i < samples; i++) {
            let blockStart = blockSize * i;
            let sum = 0;
            for (let j = 0; j < blockSize; j++) {
                sum += Math.abs(rawData[blockStart + j]);
            }
            let avg = sum / blockSize;
            let amplitude = avg * (canvas.height / 2) * MULTIPLIER;

            ctx.moveTo(i, middle - amplitude);
            ctx.lineTo(i, middle + amplitude);
        }
        ctx.stroke();
    }

    function drawRecordingProgress() {
        let startTime = Date.now();
        function animate() {
            if (!isRecording) return;
            let elapsed = Date.now() - startTime;
            let progress = Math.min(1, elapsed / RECORD_DURATION);

            userCtx.fillStyle = '#1e272e';
            userCtx.fillRect(0, 0, userCanvas.width, userCanvas.height);

            userCtx.fillStyle = '#ff4757';
            userCtx.fillRect(0, userCanvas.height / 2 - 2, userCanvas.width * progress, 4);

            animId = requestAnimationFrame(animate);
        }
        animate();
    }

    function drawFlatLine(ctx, canvas) {
        ctx.fillStyle = '#1e272e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#57606f';
        ctx.beginPath();
        ctx.moveTo(0, canvas.height / 2);
        ctx.lineTo(canvas.width, canvas.height / 2);
        ctx.stroke();
    }
</script>
</body>
</html>
