<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cooking Game 🍳</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #111827; height: 100%; overflow: hidden; touch-action: none; user-select: none; }
body { display: flex; align-items: center; justify-content: center; }
#wrap { position: absolute; width: 480px; height: 800px; }
#c { display: block; width: 480px; height: 800px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="480" height="800"></canvas>
</div>

<!-- Shared Practice Modal (identical to game.html) -->
<div class="modal fade" id="practiceModal" tabindex="-1"
     data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content" style="border-radius:24px;">
      <div class="modal-body text-center p-4" style="position:relative;">
        <button id="ppBtnSkip" title="ข้าม"
          style="position:absolute;top:10px;right:14px;background:none;border:none;font-size:1.4rem;color:#bbb;cursor:pointer;line-height:1;"
          aria-label="ข้าม">✕</button>
        <p class="text-secondary mb-1">ลองออกเสียงคำนี้ดูสิ</p>
        <div style="font-size:2.4rem;" id="ppEmoji">🔸</div>
        <div class="challenge-word" id="ppWord">บ้าน</div>
        <p class="text-secondary" id="ppReading"></p>
        <div class="practice-stage" id="ppPracticeStage">
          <div class="mouth-animation-box" id="ppMouthAnimation" style="display:none;"></div>
          <div class="mouth-diagram-box" id="ppMouthDiagram"></div>
          <div class="camera-mirror" id="ppCameraWrap">
            <video id="ppCameraVideo" autoplay muted playsinline></video>
          </div>
        </div>
        <button class="btn btn-outline-primary btn-sm" id="ppBtnListen"><i class="bi bi-volume-up-fill me-1"></i>ฟังตัวอย่าง</button>
        <canvas id="ppWaveCanvas" width="400" height="70" style="width:100%; background:var(--color-bg-soft); border-radius:14px; margin-top:0.75rem;"></canvas>
        <button class="mic-btn mt-3" id="ppBtnMic"><i class="bi bi-mic-fill"></i></button>
        <p class="small text-secondary" id="ppRecordHint">กดปุ่มไมค์เพื่อเริ่มอัดเสียง แล้วกดอีกครั้งเพื่อหยุด</p>
        <div class="alert alert-danger" id="ppErrorMsg" style="display:none;"></div>
        <div id="ppPlaybackArea" style="display:none;">
          <audio id="ppPlaybackAudio" controls style="width:100%;"></audio>
          <p class="playback-label">ฟังเสียงตัวเองแล้วให้ผู้ปกครองช่วยตัดสิน</p>
          <div class="alert alert-success" id="ppCorrectMsg" style="display:none;">เยี่ยมมาก! ได้แต้มเพิ่มแล้ว 🎉</div>
          <div class="judge-buttons">
            <button class="btn judge-btn-correct" id="ppBtnCorrect" disabled><i class="bi bi-check-circle-fill me-1"></i>ออกเสียงถูกแล้ว</button>
            <button class="btn judge-btn-retry" id="ppBtnRetry"><i class="bi bi-arrow-counterclockwise me-1"></i>ลองอีกครั้ง</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════
   SETUP
══════════════════════════════════════════════ */
var VW = 480, VH = 800;

/* ── Sound Effects ───────────────────────────── */
function loadSfx(src) {
  var a = new Audio(src);
  a.preload = 'auto';
  return a;
}
var SFX = {
  chop:  loadSfx('soundeffect/KifeChop.mp3'),
  cut:   loadSfx('soundeffect/TomatoCut.mp3'),
  bread: loadSfx('soundeffect/SlicingToast.mp3'),
};
function playSfx(sfx) {
  try { sfx.currentTime = 0; sfx.play(); } catch(e) {}
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var wrap = document.getElementById('wrap');
var now = 0;

function resize() {
  var sw = window.innerWidth / VW, sh = window.innerHeight / VH;
  var s = Math.min(sw, sh);
  wrap.style.transform = 'scale(' + s + ')';
  wrap.style.transformOrigin = 'top left';
  wrap.style.left = ((window.innerWidth - VW * s) / 2) + 'px';
  wrap.style.top = ((window.innerHeight - VH * s) / 2) + 'px';
}
resize();
window.addEventListener('resize', resize);

/* ══════════════════════════════════════════════
   COLOURS
══════════════════════════════════════════════ */
var C = {
  bg: '#111827', ui: '#1e2a40', panel: '#0f3460',
  bun: '#D4943A', bunL: '#F5BE6A', bunD: '#8C5E1E',
  tom: '#E74C3C', tomD: '#C0392B',
  cab: '#27AE60', cabD: '#1a7a44',
  sau: '#7B3F10', sauL: '#A85520',
  kni: '#B8C0CC', kniH: '#5E4A38',
  acc: '#2EC4B6', gold: '#F0A500',
  red: '#E53935', grn: '#27AE60',
  w: '#fff', gray: '#606880',
  sDone: '#27AE60', sAct: '#2EC4B6', sOff: '#1e2a40',
};

/* ══════════════════════════════════════════════
   STATE MACHINE
══════════════════════════════════════════════ */
var S = { SEL:0, BUN:1, BUN_R:2, TOM:3, TOM_R:4, CAB:5, CAB_R:6, SAU:7, SAU_R:8, CMB:9, CMB_R:10, FIN:11 };

var G;
function resetG() {
  G = {
    st: S.SEL, scores: { bun:0, tom:0, cab:0, sau:0, cmb:0 }, total: 0,
    // bun
    cutting: false, pts: [], split: false, leftPiece: [], rightPiece: [],
    // chop
    ing: 'tom', taps: 0, chopSt: 0,
    chopRun: false, chopDone: false, chopStart: 0,
    kAnim: 0, kAnimStart: 0,
    tomFinalSt: 0, cabFinalSt: 0,
    // sausage
    kY: 260, kDir: 1, kSpd: 2.8, cuts: 0, cutSc: [],
    // combine
    cList: ['tom','cab','sau'], cIdx: 0,
    sX: 240, sDir: 1, sSpd: 3.2, dropped: [], allDone: false,
  };
}
resetG();

/* ══════════════════════════════════════════════
   DRAW HELPERS
══════════════════════════════════════════════ */
function rr(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}
function fillRR(x,y,w,h,r,col) { ctx.fillStyle=col; rr(x,y,w,h,r); ctx.fill(); }
function drawBtn(x,y,w,h,txt,col) {
  fillRR(x,y,w,h,13,col);
  ctx.font='bold 15px Prompt,sans-serif'; ctx.fillStyle=C.w;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(txt,x+w/2,y+h/2); ctx.textBaseline='alphabetic';
}
function hit(px,py,x,y,w,h) { return px>=x&&px<=x+w&&py>=y&&py<=y+h; }

/* ══════════════════════════════════════════════
   SPRITE LOADER
   Place image files in img/cooking/ and they are
   used automatically. Missing files silently fall
   back to the placeholder drawing below.

   Expected filenames:
     img/cooking/bun.png
     img/cooking/tomato_0.png   (whole)
     img/cooking/tomato_1.png   (half-chopped)
     img/cooking/tomato_2.png   (fully chopped)
     img/cooking/cabbage_0.png
     img/cooking/cabbage_1.png
     img/cooking/cabbage_2.png
     img/cooking/sausage_0.png  (whole, no cuts)
     img/cooking/sausage_1.png  (first cut made)
     img/cooking/sausage_2.png  (both cuts, middle highlighted)
══════════════════════════════════════════════ */
function trySprite(src) {
  var img = new Image();
  img.ok = false;
  img.onload  = function(){ img.ok = true; };
  img.onerror = function(){ img.ok = false; };
  img.src = src;
  return img;
}
var SPR = {
  bg:  trySprite('img/cooking/bg.jpg'),
  bun: trySprite('img/cooking/bun.png'),
  tom: [
    trySprite('img/cooking/tomato_0.png'),
    trySprite('img/cooking/tomato_1.png'),
    trySprite('img/cooking/tomato_2.png'),
  ],
  cab: [
    trySprite('img/cooking/cabbage_0.png'),
    trySprite('img/cooking/cabbage_1.png'),
    trySprite('img/cooking/cabbage_2.png'),
  ],
  sau: [
    trySprite('img/cooking/sausage_0.png'),
    trySprite('img/cooking/sausage_1.png'),
    trySprite('img/cooking/sausage_2.png'),
  ],
};

function drawBg() {
  if (SPR.bg.ok) {
    var iw = SPR.bg.naturalWidth, ih = SPR.bg.naturalHeight;
    var scale = Math.max(VW / iw, VH / ih);
    var dw = iw * scale, dh = ih * scale;
    ctx.drawImage(SPR.bg, (VW - dw) / 2, (VH - dh) / 2, dw, dh);
  } else {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, VW, VH);
  }
}

/* ══════════════════════════════════════════════
   SPRITES (placeholder shapes)
══════════════════════════════════════════════ */
/* cx = centre-x of bun, cy = top-y, w = total width, h = height */
function sBunTop(cx,cy,w,h) {
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=10; ctx.shadowOffsetY=5;
  ctx.fillStyle=C.bun;
  ctx.beginPath();
  ctx.ellipse(cx,cy+h*.35,w/2,h*.6,0,Math.PI,0,false);
  ctx.lineTo(cx+w/2,cy+h); ctx.lineTo(cx-w/2,cy+h); ctx.closePath(); ctx.fill();
  ctx.fillStyle=C.bunD;
  ctx.fillRect(cx-w/2,cy+h-10,w,10);
  ctx.fillStyle='rgba(255,255,255,.18)';
  ctx.beginPath(); ctx.ellipse(cx-w*.13,cy+h*.15,w*.16,h*.1,-0.4,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function sBunBot(cx,cy,w,h) {
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=8; ctx.shadowOffsetY=4;
  ctx.fillStyle=C.bunD;
  ctx.beginPath();
  ctx.ellipse(cx,cy+h*.65,w/2+6,h*.38,0,0,Math.PI,false);
  ctx.lineTo(cx-w/2-6,cy); ctx.lineTo(cx+w/2+6,cy); ctx.closePath(); ctx.fill();
  ctx.fillStyle=C.bun; ctx.fillRect(cx-w/2,cy,w,h*.6);
  ctx.restore();
}

function sTomato(cx,cy,r,st) {
  ctx.save();
  if(st===0){
    ctx.fillStyle=C.tom; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=C.cabD; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(cx,cy-r); ctx.quadraticCurveTo(cx+12,cy-r-20,cx+7,cy-r-32); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.22)';
    ctx.beginPath(); ctx.ellipse(cx-r*.26,cy-r*.26,r*.2,r*.14,-0.5,0,Math.PI*2); ctx.fill();
  } else if(st===1){
    ctx.fillStyle=C.tomD; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(255,190,180,.5)'; ctx.lineWidth=3;
    for(var i=-3;i<=3;i++){ ctx.beginPath(); ctx.moveTo(cx+i*r/3.5,cy-r+6); ctx.lineTo(cx+i*r/3.5,cy+r-6); ctx.stroke(); }
  } else {
    ctx.fillStyle=C.tomD;
    for(var j=0;j<9;j++){
      var a=(j/9)*Math.PI*2, d=r*.52+(j%3)*r*.28;
      ctx.beginPath(); ctx.ellipse(cx+Math.cos(a)*d,cy+Math.sin(a)*d,r*.3,r*.17,a,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}

function sCabbage(cx,cy,r,st) {
  ctx.save();
  if(st===0){
    for(var i=4;i>=0;i--){ ctx.fillStyle=i%2===0?C.cab:C.cabD; ctx.beginPath(); ctx.ellipse(cx,cy+i*4,r-i*7,(r-i*7)*.85,0,0,Math.PI*2); ctx.fill(); }
  } else if(st===1){
    ctx.fillStyle=C.cabD; ctx.beginPath(); ctx.ellipse(cx,cy,r,r*.85,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(180,255,180,.4)'; ctx.lineWidth=2;
    for(var i=-3;i<=3;i++){ ctx.beginPath(); ctx.moveTo(cx-r+4,cy+i*r/4); ctx.lineTo(cx+r-4,cy+i*r/4); ctx.stroke(); }
  } else {
    ctx.fillStyle=C.cab;
    for(var j=0;j<13;j++){
      var a=(j/13)*Math.PI*2+.2, d=r*.25+Math.abs(Math.sin(j))*r*.75;
      ctx.beginPath(); ctx.ellipse(cx+Math.cos(a)*d,cy+Math.sin(a)*d,r*.22,r*.07,a+.4,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}

/* Sprite-aware wrappers — use loaded image if available, else placeholder */
function drawTomatoSprite(cx,cy,r,st) {
  var img = SPR.tom[st];
  if (img && img.ok) {
    ctx.drawImage(img, cx-r, cy-r, r*2, r*2);
  } else {
    sTomato(cx, cy, r, st);
  }
}
function drawCabbageSprite(cx,cy,r,st) {
  var img = SPR.cab[st];
  if (img && img.ok) {
    ctx.drawImage(img, cx-r, cy-r, r*2, r*2);
  } else {
    sCabbage(cx, cy, r, st);
  }
}

function sSausageFull(cuts) {
  // Connectors between links
  for (var i = 0; i < NL-1; i++) {
    var gy = STOP + i*LH + LH;
    ctx.fillStyle = '#4a2008';
    ctx.fillRect(SCX-7, gy-4, 14, STOP+(i+1)*LH-gy+8);
  }
  // All links — none are hidden even after cuts
  for (var i = 0; i < NL; i++) {
    var ly = STOP + i*LH + LH/2;
    sSauLink(SCX, ly, LW, LH-10);
  }
  // White cut lines at each completed cut
  for (var ci = 0; ci < Math.min(cuts, CUT_TY.length); ci++) {
    var ty = CUT_TY[ci];
    ctx.save();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3.5;
    ctx.shadowColor = C.acc; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.moveTo(SCX-LW/2-10, ty); ctx.lineTo(SCX+LW/2+10, ty); ctx.stroke();
    ctx.restore();
  }
  // Golden highlight on the middle piece after both cuts
  if (cuts >= 2) {
    ctx.save();
    ctx.fillStyle = 'rgba(240,165,0,0.2)';
    ctx.fillRect(SCX-LW/2-5, CUT_TY[0], LW+10, CUT_TY[1]-CUT_TY[0]);
    ctx.strokeStyle = C.gold; ctx.lineWidth = 2; ctx.setLineDash([4,3]);
    ctx.strokeRect(SCX-LW/2-5, CUT_TY[0], LW+10, CUT_TY[1]-CUT_TY[0]);
    ctx.setLineDash([]); ctx.restore();
  }
}
function drawSausageSprite(cuts) {
  var st = Math.min(cuts, 2);
  var img = SPR.sau[st];
  if (img && img.ok) {
    ctx.drawImage(img, SCX-LW/2, STOP, LW, NL*LH);
  } else {
    sSausageFull(cuts);
  }
}

/* Draw the actual sausage segment between the player's cuts, rotated 90° CW.
   topY/botY = cut boundaries; the links are clipped to that region then
   rotated so the sausage lies horizontally in the hot dog. */
function drawAssemblySausagePiece(cx, cy, targetW, targetH) {
  var topY = G.cuts >= 1 ? CUT_TY[0] : STOP;
  var botY = G.cuts >= 2 ? CUT_TY[1] : STOP + NL*LH;
  var pieceH = botY - topY;
  var srcCX = SCX, srcCY = (topY + botY) / 2;
  // 90° CW: pieceH → screen width, LW → screen height
  var sx = targetW / pieceH;
  var sy = targetH / LW;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(sx, sy);
  ctx.rotate(Math.PI / 2);
  ctx.translate(-srcCX, -srcCY);
  // Clip to the exact cut region
  ctx.beginPath();
  ctx.rect(SCX - LW/2 - 1, topY, LW + 2, pieceH);
  ctx.clip();
  // Draw connectors then links — clip handles the rest
  for (var i = 0; i < NL-1; i++) {
    var gy = STOP + i*LH + LH;
    ctx.fillStyle = '#4a2008';
    ctx.fillRect(SCX-7, gy-4, 14, STOP+(i+1)*LH-gy+8);
  }
  for (var i = 0; i < NL; i++) {
    sSauLink(SCX, STOP+i*LH+LH/2, LW, LH-10);
  }
  ctx.restore();
}

/* Returns 0..1 fraction of sausage that forms the middle piece after the player's cuts */
function getSausageFraction() {
  if (G.cuts >= 2) return (CUT_TY[1] - CUT_TY[0]) / (NL * LH);
  if (G.cuts === 1) return ((STOP + NL*LH) - CUT_TY[0]) / (NL * LH);
  return 1.0;
}

/* Draw a player-cut bun polygon into a target area with 90° CW rotation.
   The bun was cut as a wide landscape rectangle; rotating it makes it appear
   as a side-view bun half in the hot dog assembly.
   After 90° CW rotation the bun's width (BW=320) becomes the target height
   and its height (BH=150) becomes the target width. */
function drawAssemblyBunPiece(poly, targetCX, targetCY, targetW, targetH) {
  if (!poly || poly.length < 2) return false;
  var sx = targetW / BH;   // BH=150 → becomes the rotated width
  var sy = targetH / BW;   // BW=320 → becomes the rotated height
  var ox = BCX, oy = BTY + BH / 2;   // bun centre in original space
  function applyTransform() {
    ctx.translate(targetCX, targetCY);
    ctx.scale(sx, sy);
    ctx.rotate(Math.PI / 2);   // 90° clockwise
    ctx.translate(-ox, -oy);
  }
  ctx.save();
  applyTransform();
  ctx.beginPath(); ctx.moveTo(poly[0].x, poly[0].y);
  for (var i = 1; i < poly.length; i++) ctx.lineTo(poly[i].x, poly[i].y);
  ctx.closePath(); ctx.clip();
  drawBunSprite();
  ctx.restore();
  ctx.save();
  applyTransform();
  ctx.beginPath(); ctx.moveTo(poly[0].x, poly[0].y);
  for (var i = 1; i < poly.length; i++) ctx.lineTo(poly[i].x, poly[i].y);
  ctx.closePath();
  ctx.strokeStyle = C.bunD; ctx.lineWidth = 2.5 / Math.min(sx, sy); ctx.stroke();
  ctx.restore();
  return true;
}

/* Draw an ingredient layer using the actual state from the player's work */
function drawAssemblyLayer(ing, cx, cy, w) {
  ctx.save();
  if (ing === 'tom' || ing === 'tomato') {
    var tSt = G.tomFinalSt || 0;
    ctx.fillStyle = tSt >= 2 ? C.tomD : C.tom;
    ctx.beginPath(); ctx.ellipse(cx, cy, w/2, 11, 0, 0, Math.PI*2); ctx.fill();
    if (tSt === 0) {
      ctx.fillStyle = 'rgba(255,220,200,.55)';
      [-22,0,22].forEach(function(dx){ ctx.beginPath(); ctx.ellipse(cx+dx,cy,4,8,0,0,Math.PI*2); ctx.fill(); });
    } else {
      ctx.strokeStyle = 'rgba(255,190,180,.7)'; ctx.lineWidth = 2;
      var nc = tSt >= 2 ? 7 : 4;
      for (var i = 0; i < nc; i++) {
        var lx = cx - w*0.44 + i*(w*0.88/(nc-1));
        ctx.beginPath(); ctx.moveTo(lx, cy-9); ctx.lineTo(lx, cy+9); ctx.stroke();
      }
    }
  } else if (ing === 'cab' || ing === 'cabbage') {
    var cSt = G.cabFinalSt || 0;
    ctx.fillStyle = C.cab; ctx.beginPath(); ctx.ellipse(cx, cy, w/2+8, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = C.cabD; ctx.lineWidth = 1.5;
    var nc = cSt >= 2 ? 7 : (cSt >= 1 ? 4 : 2);
    for (var i = 0; i < nc; i++) {
      var lx = cx - w*0.44 + i*(w*0.88/Math.max(nc-1,1));
      ctx.beginPath(); ctx.moveTo(lx, cy-6); ctx.lineTo(lx, cy+6); ctx.stroke();
    }
  } else {
    drawAssemblySausagePiece(cx, cy, w - 16, 36);
  }
  ctx.restore();
}

function sKnife(kx,ky,angle) {
  ctx.save(); ctx.translate(kx,ky); ctx.rotate(angle);
  ctx.fillStyle=C.kniH; rr(-10,0,20,52,5); ctx.fill();
  ctx.fillStyle='#7a8090'; ctx.fillRect(-14,-6,28,10);
  ctx.fillStyle=C.kni;
  ctx.beginPath(); ctx.moveTo(-8,-6); ctx.lineTo(8,-6); ctx.lineTo(5,-76); ctx.lineTo(0,-90); ctx.lineTo(-5,-76); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.3)';
  ctx.beginPath(); ctx.moveTo(-5,-6); ctx.lineTo(-1,-6); ctx.lineTo(0,-76); ctx.lineTo(-4,-76); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function sSauLink(cx,cy,w,h) {
  ctx.save();
  ctx.fillStyle=C.sau; ctx.beginPath(); ctx.ellipse(cx,cy,w/2,h/2,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=C.sauL; ctx.beginPath(); ctx.ellipse(cx-w*.13,cy-h*.18,w*.17,h*.12,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function sIngLayer(ing,cx,cy,w) {
  ctx.save();
  if(ing==='tom'||ing==='tomato'){
    ctx.fillStyle=C.tom; ctx.beginPath(); ctx.ellipse(cx,cy,w/2,11,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,220,200,.55)';

// Bun rectangle bounds
var BLX=80, BTY=315, BRX=400, BBY=465;
var BCX=VW/2, BW=BRX-BLX, BH=BBY-BTY;

function bestFit(pts) {
  var n=pts.length;
  if(n<2) return 90;
  var sx=0,sy=0,sxy=0,sxx=0;
  pts.forEach(function(p){ sx+=p.x; sy+=p.y; sxy+=p.x*p.y; sxx+=p.x*p.x; });
  var d=n*sxx-sx*sx;
  if(Math.abs(d)<1e-5) return 90;
  var m=(n*sxy-sx*sy)/d;
  return Math.atan(m)*180/Math.PI;
}

/* ── BUN SPRITE ─────────────────────────────────────────────────────
   PLACEHOLDER: draws a coloured rectangle.
   To use a real sprite later, replace the body of this function with:
     ctx.drawImage(bunImg, BLX, BTY, BW, BH);
   Everything else (clipping, polygon-split, scoring) stays unchanged.
──────────────────────────────────────────────────────────────────── */
function drawBunSprite() {
  if (SPR.bun.ok) {
    ctx.drawImage(SPR.bun, BLX, BTY, BW, BH);
  } else {
    fillRR(BLX,BTY,BW,BH,14,C.bun);
    ctx.strokeStyle=C.bunD; ctx.lineWidth=3; rr(BLX,BTY,BW,BH,14); ctx.stroke();
    ctx.fillStyle=C.bunD;
    [[185,338],[225,348],[265,336],[305,348],[345,336],[160,352],[380,350]].forEach(function(d){
      ctx.beginPath(); ctx.arc(d[0],d[1],4.5,0,Math.PI*2); ctx.fill();
    });
  }
}

/* Clip canvas to a polygon, draw the full bun sprite inside, then stroke the edge */
function drawBunPiece(poly,dx) {
  if(!poly||poly.length<2) return;
  ctx.save();
  ctx.translate(dx,0);
  // Clip to the polygon shape
  ctx.beginPath(); ctx.moveTo(poly[0].x,poly[0].y);
  for(var i=1;i<poly.length;i++) ctx.lineTo(poly[i].x,poly[i].y);
  ctx.closePath(); ctx.clip();
  // Draw sprite inside the clip (only the polygon region shows)
  drawBunSprite();
  ctx.restore();
  // Draw the cut-edge outline on top
  ctx.save(); ctx.translate(dx,0);
  ctx.beginPath(); ctx.moveTo(poly[0].x,poly[0].y);
  for(var i=1;i<poly.length;i++) ctx.lineTo(poly[i].x,poly[i].y);
  ctx.closePath();
  ctx.strokeStyle=C.bunD; ctx.lineWidth=2.5; ctx.stroke();
  ctx.restore();
}

    drawBtn(VW/2-85,BBY+98,170,52,'ต่อไป →',C.acc);

    // Full uncut bun sprite

    // Guideline
    ctx.setLineDash([9,6]); ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(BCX,BTY-22); ctx.lineTo(BCX,BBY+22); ctx.stroke();

    if(G.pts.length>1){

      ctx.beginPath(); ctx.moveTo(G.pts[0].x,G.pts[0].y);

function drawCmb(ts) {
  drawBg();
  drawStepBar();
  var cur=G.cList[G.cIdx];

  if(G.cIdx<G.cList.length){
    ctx.font='15px Prompt'; ctx.fillStyle='rgba(255,255,255,.85)'; ctx.textAlign='center';
    ctx.fillText('แตะเพื่อวาง'+(ING_LABELS[cur]||cur)+'!',VW/2,SH+26);
    G.sX+=G.sDir*G.sSpd;
    if(G.sX>VW-45) G.sDir=-1; if(G.sX<45) G.sDir=1;
  }

  // Bottom bun — player's actual cut right-piece
  if (!drawAssemblyBunPiece(G.rightPiece, VW/2, BBY+23, 222, 46)) sBunBot(VW/2,BBY,222,46);

  // Dropped ingredient layers — animate each one falling to its stacked position
  G.dropped.forEach(function(d){
    var elapsed = ts - d.dropStart;
    var t = Math.min(1, elapsed / DROP_DUR);
    var ease = 1 - (1-t)*(1-t);   // ease-out quad
    var cy = d.fromY + (d.toY - d.fromY) * ease;
    drawAssemblyLayer(d.ing, d.x, cy, 185);
  });

  // Top bun after all done — player's actual left-piece
  if(G.cIdx>=G.cList.length){
    if (!drawAssemblyBunPiece(G.leftPiece, VW/2, BBY-G.dropped.length*20-33, 222, 55))
      sBunTop(VW/2,BBY-G.dropped.length*20-60,222,55);
  }

  // Moving ingredient — show at player's actual chop/cut state
  if(G.cIdx<G.cList.length){
    // Target zone
    ctx.strokeStyle='rgba(46,196,182,.38)'; ctx.lineWidth=2; ctx.setLineDash([5,4]);
    ctx.strokeRect(VW/2-CTW/2,BBY-14,CTW,20); ctx.setLineDash([]);
    ctx.fillStyle='rgba(46,196,182,.06)'; ctx.fillRect(VW/2-CTW/2,BBY-14,CTW,20);

    // Drop guide line
    ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=1; ctx.setLineDash([3,6]);
    ctx.beginPath(); ctx.moveTo(G.sX,240); ctx.lineTo(G.sX,BBY-14); ctx.stroke(); ctx.setLineDash([]);

    var ir=38;
    if(cur==='tom') drawTomatoSprite(G.sX,225,ir,G.tomFinalSt);
    else if(cur==='cab') drawCabbageSprite(G.sX,225,ir,G.cabFinalSt);
    else { drawAssemblySausagePiece(G.sX, 225, 80, 30); }
  }

  if(G.cIdx>=G.cList.length&&!G.allDone){
    G.allDone=true;
    var acc=G.dropped.reduce(function(s,d){ return s+d.acc; },0)/G.dropped.length;
    G.scores.cmb=Math.round(acc*100);
    G.total+=G.scores.cmb;
    setTimeout(function(){ G.st=S.CMB_R; },700);
  }
}

  drawBtn(VW/2-94,614,188,52,'🔄 เล่นอีกครั้ง',C.acc);
  drawBtn(VW/2-94,680,188,46,'← กลับ',C.gray);
}

/* ══════════════════════════════════════════════
   WORD POOL — loaded from game.html setup via sessionStorage
══════════════════════════════════════════════ */
var _pool = [];
(function() {
  try {
    var raw = sessionStorage.getItem('cookingWords');
    if (raw) { _pool = JSON.parse(raw); sessionStorage.removeItem('cookingWords'); }
  } catch(e) {}
  if (!_pool.length) { location.href = 'game.html'; }
})();

// Index per result state: BUN→0, TOM→1, CAB→2, SAU→3, CMB→4
var STEP_IDX = {};
STEP_IDX[S.BUN_R]=0; STEP_IDX[S.TOM_R]=1; STEP_IDX[S.CAB_R]=2;
STEP_IDX[S.SAU_R]=3; STEP_IDX[S.CMB_R]=4;

function getStepWord(fromSt) {
  var idx = STEP_IDX[fromSt];
  if (idx === undefined || !_pool.length) return null;
  return _pool[idx % _pool.length];
}

/* ══════════════════════════════════════════════
   WORD POPUP — uses the shared PracticePanel (same as other games)
══════════════════════════════════════════════ */
function showPopup(fromSt, toSt) {
  var w = getStepWord(fromSt);
  if (!w) { initSt(toSt); G.st = toSt; return; }
  PracticePanel.open(w, {
    onClosed: function() { initSt(toSt); G.st = toSt; }
  });
}

/* ══════════════════════════════════════════════
   STATE INIT
══════════════════════════════════════════════ */
function initSt(s) {
  if(s===S.TOM){ G.ing='tom'; G.taps=0; G.chopSt=0; G.chopRun=false; G.chopDone=false; G.chopStart=0; G.kAnim=0; }
  if(s===S.CAB){ G.ing='cab'; G.taps=0; G.chopSt=0; G.chopRun=false; G.chopDone=false; G.chopStart=0; G.kAnim=0; }
  if(s===S.SAU){ G.kY=260; G.kDir=1; G.kSpd=2.8; G.cuts=0; G.cutSc=[]; G.scores.sau=0; }
  if(s===S.CMB){ G.cList=['tom','cab','sau']; G.cIdx=0; G.sX=240; G.sDir=1; G.dropped=[]; G.allDone=false; }
}

/* ══════════════════════════════════════════════
   MAIN LOOP
══════════════════════════════════════════════ */
function loop(ts) {
  now=ts; ctx.clearRect(0,0,VW,VH);
  switch(G.st){
    case S.SEL:   drawSel(); break;
    case S.BUN:   drawBunCut(ts); break;
    case S.BUN_R: drawResult('bun','ขนมปัง'); break;
    case S.TOM:   drawChop(ts); break;
    case S.TOM_R: drawResult('tom','มะเขือเทศ'); break;
    case S.CAB:   drawChop(ts); break;
    case S.CAB_R: drawResult('cab','กะหล่ำปลี'); break;
    case S.SAU:   drawSau(ts); break;
    case S.SAU_R: drawResult('sau','ไส้กรอก'); break;
    case S.CMB:   drawCmb(ts); break;
    case S.CMB_R: drawResult('cmb','ฮอทดอก'); break;
    case S.FIN:   drawFinal(); break;
  }
  requestAnimationFrame(loop);
}

/* ══════════════════════════════════════════════
   INPUT
══════════════════════════════════════════════ */
function getPos(e) {
  var r=canvas.getBoundingClientRect();
  var t=e.touches?e.touches[0]:(e.changedTouches?e.changedTouches[0]:e);
  return { x:(t.clientX-r.left)/(r.width/VW), y:(t.clientY-r.top)/(r.height/VH) };
}

canvas.addEventListener('pointerdown',function(e){
  e.preventDefault(); var p=getPos(e);

  // Food Select
  if(G.st===S.SEL){
    if(hit(p.x,p.y,30,160,130,162)){ G.st=S.BUN; } return;
  }
  // Bun Cut
  if(G.st===S.BUN){
    if(!G.split){ G.cutting=true; G.pts=[p]; }
    else if(hit(p.x,p.y,VW/2-85,BBY+98,170,52)){ G.st=S.BUN_R; }
    return;
  }
  // Bun Result
  if(G.st===S.BUN_R){
    if(hit(p.x,p.y,VW/2-100,SH+258,200,54)) showPopup(S.BUN_R,S.TOM);
    return;
  }
  // Chop Tomato / Cabbage
  if(G.st===S.TOM||G.st===S.CAB){
    if(G.chopDone){ if(hit(p.x,p.y,VW/2-80,412,160,50)) G.st=(G.ing==='tom'?S.TOM_R:S.CAB_R); return; }
    var dx=p.x-ICX,dy=p.y-ICY;
    if(dx*dx+dy*dy<(IR+22)*(IR+22)){
      if(!G.chopRun){ G.chopRun=true; G.chopStart=now; }
      G.taps++; G.chopSt=G.taps>=8?2:G.taps>=4?1:0;
      G.kAnim=1; G.kAnimStart=now;
      playSfx(SFX.chop);
      if(G.chopSt>=2&&!G.chopDone){ finishChop(); playSfx(SFX.cut); }
    }
    return;
  }
  if(G.st===S.TOM_R){ if(hit(p.x,p.y,VW/2-100,SH+258,200,54)) showPopup(S.TOM_R,S.CAB); return; }
  if(G.st===S.CAB_R){ if(hit(p.x,p.y,VW/2-100,SH+258,200,54)) showPopup(S.CAB_R,S.SAU); return; }
  // Cut Sausage
  if(G.st===S.SAU){
    if(G.cuts>=2){ if(hit(p.x,p.y,VW/2-80,402,160,50)) G.st=S.SAU_R; return; }
    var tIdx=G.cuts;
    var tY=CUT_TY[tIdx];
    var dist=Math.abs(G.kY-tY);
    var cs=Math.round(Math.max(10,100-dist*2));
    G.cutSc.push(cs); G.cuts++;
    if(G.cuts>=2){ G.scores.sau=Math.round((G.cutSc[0]+G.cutSc[1])/2); G.total+=G.scores.sau; }
    return;
  }
  if(G.st===S.SAU_R){ if(hit(p.x,p.y,VW/2-100,SH+258,200,54)) showPopup(S.SAU_R,S.CMB); return; }
  // Combine
  if(G.st===S.CMB){
    if(G.cIdx<G.cList.length){
      var acc=Math.max(0,1-Math.abs(G.sX-VW/2)/(CTW/2));
      var toY=BBY-22-G.dropped.length*20;
      G.dropped.push({ing:G.cList[G.cIdx],x:G.sX,acc:acc,dropStart:now,fromY:225,toY:toY});
      G.cIdx++;
    }
    return;
  }
  if(G.st===S.CMB_R){ if(hit(p.x,p.y,VW/2-100,SH+258,200,54)) showPopup(S.CMB_R,S.FIN); return; }
  // Final
  if(G.st===S.FIN){
    if(hit(p.x,p.y,VW/2-94,614,188,52)){ resetG(); }
    if(hit(p.x,p.y,VW/2-94,680,188,46)){ location.href='game.html'; }
    return;
  }
},{passive:false});

canvas.addEventListener('pointermove',function(e){
  e.preventDefault();
  if(G.st===S.BUN&&G.cutting) G.pts.push(getPos(e));
},{passive:false});

canvas.addEventListener('pointerup',function(e){
  e.preventDefault();
  if(G.st===S.BUN&&G.cutting){
    var raw=G.pts.slice();
    G.cutting=false;
    if(raw.length<4){G.pts=[];return;}
    // Ensure top-to-bottom order
    if(raw[0].y>raw[raw.length-1].y) raw.reverse();
    // Reject cut that doesn't span at least half the bun height
    if(raw[raw.length-1].y-raw[0].y < BH*0.5){G.pts=[];return;}

    // Clip path to bun rectangle, interpolating exact entry (BTY) and exit (BBY)
    var clip=[]; var entryDone=false, exitDone=false;
    for(var ci=0; ci<raw.length&&!exitDone; ci++){
      var cp=raw[ci], pp=ci>0?raw[ci-1]:null;
      // Entry at top edge
      if(!entryDone){
        if(cp.y>=BTY){
          if(pp&&pp.y<BTY){var et=(BTY-pp.y)/(cp.y-pp.y);clip.push({x:pp.x+et*(cp.x-pp.x),y:BTY});}
          else{clip.push({x:cp.x,y:BTY});}
          entryDone=true;
        }
      }
      // Inside bun
      if(entryDone&&cp.y>=BTY&&cp.y<=BBY){
        clip.push({x:Math.max(BLX,Math.min(BRX,cp.x)),y:cp.y});
      }
      // Exit at bottom edge
      if(entryDone&&!exitDone&&pp&&pp.y<=BBY&&cp.y>BBY){
        var xt=(BBY-pp.y)/(cp.y-pp.y);
        clip.push({x:Math.max(BLX,Math.min(BRX,pp.x+xt*(cp.x-pp.x))),y:BBY});
        exitDone=true;
      }
    }
    // If cut ended inside the bun, project exit to bottom edge
    if(!exitDone&&clip.length>0){
      clip.push({x:Math.max(BLX,Math.min(BRX,raw[raw.length-1].x)),y:BBY});
    }
    if(clip.length<2){G.pts=[];return;}
    // Anchor first/last to exact bun edges
    clip[0].y=BTY; clip[clip.length-1].y=BBY;

    // Build two polygons split along the cut path
    // Left piece:  TL → [cut] → BL
    G.leftPiece  = [{x:BLX,y:BTY}].concat(clip).concat([{x:BLX,y:BBY}]);
    // Right piece: TR → BR → [cut reversed]
    G.rightPiece = [{x:BRX,y:BTY},{x:BRX,y:BBY}].concat(clip.slice().reverse());

    // Score = how vertical the cut was (0° off = 100 pts)
    var angle=bestFit(clip);
    var fromVert=Math.abs(Math.abs(angle)-90);
    G.scores.bun=Math.round(Math.max(0,100-fromVert*2.2));
    G.total+=G.scores.bun;
    G.split=true;
    playSfx(SFX.bread);
  }
},{passive:false});

/* ══════════════════════════════════════════════
   START
══════════════════════════════════════════════ */
requestAnimationFrame(loop);
</script>
