<svg viewBox="0 0 320 205" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ปัดขึ้นกระโดด ปัดลงสไลด์ หลบหนามและหลุม เก็บคำศัพท์">
  <!-- Platformer tutorial, same red/green split as the airplane one.
       Hazards per js/game-platformer.js: ground spikes (jump), ceiling
       spike rows (slide under), and gaps/pits (fall = game over).
       Pickup: the word bubble. Colours: ground #795548 / #6d4c41,
       spikes #d32f2f, bubble #f0a500, accent #2ec4b6. -->
  <defs>
    <clipPath id="pfL"><rect x="12" y="14" width="140" height="98" rx="12"/></clipPath>
    <clipPath id="pfR"><rect x="168" y="14" width="140" height="98" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="320" height="205" rx="18" fill="#EEF9F8"/>

  <!-- ── AVOID ── -->
  <g clip-path="url(#pfL)">
    <rect x="12" y="14" width="140" height="98" fill="#CDE8F5"/>
    <!-- ceiling spike row -->
    <rect x="12" y="14" width="52" height="12" fill="#6d4c41"/>
    <path d="M14 26 l7 13 l7 -13 l7 13 l7 -13 l7 13 l7 -13 l7 13 l7 -13z" fill="#d32f2f"/>
    <!-- ground with a pit -->
    <rect x="12" y="88" width="42" height="24" fill="#795548"/>
    <rect x="12" y="88" width="42" height="5" fill="#8d6e63"/>
    <rect x="96" y="88" width="56" height="24" fill="#795548"/>
    <rect x="96" y="88" width="56" height="5" fill="#8d6e63"/>
    <!-- ground spike -->
    <path d="M108 88 l9 -22 l9 22z" fill="#d32f2f" stroke="#a01c1c" stroke-width="1.5"/>
  </g>
  <rect x="12" y="14" width="140" height="98" rx="12" fill="none" stroke="#E53935" stroke-width="3"/>
  <circle cx="145" cy="21" r="13" fill="#E53935"/>
  <path d="M139 15 L151 27 M151 15 L139 27" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
  <!-- pit label -->
  <text x="75" y="106" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="9.5" font-weight="700" fill="#E53935">หลุม</text>

  <!-- ── COLLECT ── -->
  <g clip-path="url(#pfR)">
    <rect x="168" y="14" width="140" height="98" fill="#CDE8F5"/>
    <rect x="168" y="88" width="140" height="24" fill="#795548"/>
    <rect x="168" y="88" width="140" height="5" fill="#8d6e63"/>
    <!-- word bubble -->
    <g transform="translate(238,50)">
      <circle cx="0" cy="0" r="26" fill="#f0a500" opacity="0.25"/>
      <circle cx="0" cy="0" r="20" fill="#fffde7" stroke="#f39c12" stroke-width="3"/>
      <text x="0" y="6" text-anchor="middle" font-family="Prompt, sans-serif"
            font-size="15" font-weight="700" fill="#8a5a2b">คำ</text>
    </g>
    <!-- runner -->
    <g transform="translate(196,74)">
      <circle cx="0" cy="-8" r="7" fill="#2b2438"/>
      <rect x="-4" y="-2" width="8" height="12" rx="3" fill="#2ec4b6"/>
    </g>
  </g>
  <rect x="168" y="14" width="140" height="98" rx="12" fill="none" stroke="#27AE60" stroke-width="3"/>
  <circle cx="301" cy="21" r="13" fill="#27AE60"/>
  <path d="M295 21 L299.5 26 L308 16" stroke="#fff" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- ── captions ── -->
  <text x="82" y="130" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="14" font-weight="700" fill="#E53935">ห้ามชน! ห้ามตก</text>
  <text x="82" y="147" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11" fill="#7a6f80">หนามพื้น · หนามเพดาน · หลุม</text>
  <text x="82" y="162" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="10.5" fill="#9a90a4">ชนหรือตก = จบเกมทันที</text>

  <text x="238" y="130" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="14" font-weight="700" fill="#27AE60">เก็บลูกโป่งคำ</text>
  <text x="238" y="147" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11" fill="#7a6f80">เก็บแล้วได้ฝึกพูด</text>
  <text x="238" y="162" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="10.5" fill="#9a90a4">พูดถูกจะได้เกราะกันชนชั่วคราว</text>

  <line x1="160" y1="24" x2="160" y2="168" stroke="#D8F0EE" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- controls -->
  <rect x="14" y="174" width="292" height="24" rx="9" fill="#ffffff" stroke="#D8F0EE" stroke-width="2"/>
  <text x="160" y="190" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11.5" font-weight="700" fill="#5b5170">👆 ปัดขึ้น = กระโดด · ปัดลง = สไลด์ลอด</text>
</svg>
