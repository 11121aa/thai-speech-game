<svg viewBox="0 0 320 205" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="แตะไพ่เพื่อพลิก จับคู่ภาพที่เหมือนกัน">
  <!-- Matching game tutorial: three steps left to right.
       Colours from js/game-matching.js — card back #2ec4b6 with #13726a
       edge, revealed face #e0f2fe, matched pair #fef3c7 with #f59e0b.
       The deck is picture-to-picture (both cards show the same image),
       which is what this diagram has to make obvious. -->
  <rect x="0" y="0" width="320" height="205" rx="18" fill="#EEF9F8"/>

  <!-- step 1: two face-down cards, one being tapped -->
  <g>
    <rect x="16" y="26" width="38" height="52" rx="7" fill="#2ec4b6" stroke="#13726a" stroke-width="2.5"/>
    <path d="M28 42 h14 M28 52 h14 M28 62 h14" stroke="#8fe3dc" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="60" y="26" width="38" height="52" rx="7" fill="#2ec4b6" stroke="#13726a" stroke-width="2.5"/>
    <path d="M72 42 h14 M72 52 h14 M72 62 h14" stroke="#8fe3dc" stroke-width="2.5" stroke-linecap="round"/>
    <text x="86" y="96" font-size="17">☝️</text>
  </g>
  <text x="57" y="120" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="13" font-weight="700" fill="#13726a">1. แตะเพื่อพลิก</text>

  <!-- arrow -->
  <path d="M104 52 L120 52" stroke="#B6E3DE" stroke-width="3" stroke-linecap="round"/>
  <path d="M116 47 L122 52 L116 57" fill="none" stroke="#B6E3DE" stroke-width="3" stroke-linecap="round"/>

  <!-- step 2: two revealed cards showing the SAME picture -->
  <g>
    <rect x="126" y="26" width="38" height="52" rx="7" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2.5"/>
    <text x="145" y="60" text-anchor="middle" font-size="22">🐔</text>
    <rect x="170" y="26" width="38" height="52" rx="7" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2.5"/>
    <text x="189" y="60" text-anchor="middle" font-size="22">🐔</text>
  </g>
  <text x="167" y="120" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="13" font-weight="700" fill="#0369a1">2. ภาพเหมือนกัน</text>

  <!-- arrow -->
  <path d="M214 52 L230 52" stroke="#B6E3DE" stroke-width="3" stroke-linecap="round"/>
  <path d="M226 47 L232 52 L226 57" fill="none" stroke="#B6E3DE" stroke-width="3" stroke-linecap="round"/>

  <!-- step 3: matched pair + practice -->
  <g>
    <rect x="236" y="26" width="34" height="52" rx="7" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="253" y="58" text-anchor="middle" font-size="19">🐔</text>
    <rect x="274" y="26" width="34" height="52" rx="7" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="291" y="58" text-anchor="middle" font-size="19">🐔</text>
    <circle cx="272" cy="88" r="12" fill="#27AE60"/>
    <path d="M266 88 L270.5 93 L279 83" stroke="#fff" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="272" y="120" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="13" font-weight="700" fill="#b45309">3. ได้ฝึกพูด</text>

  <!-- explanation -->
  <rect x="14" y="132" width="292" height="40" rx="10" fill="#ffffff" stroke="#D8F0EE" stroke-width="2"/>
  <text x="160" y="148" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11.5" fill="#5b5170">พลิกไพ่ทีละ 2 ใบ ถ้าภาพเหมือนกันจะจับคู่ได้</text>
  <text x="160" y="165" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11.5" fill="#5b5170">ถ้าไม่เหมือน ไพ่จะคว่ำกลับ ให้จำตำแหน่งไว้</text>

  <text x="160" y="192" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="12" font-weight="700" fill="#13726a">⏱ จับคู่ให้ครบทุกคู่ให้เร็วที่สุด!</text>
</svg>
