<svg viewBox="0 0 320 205" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="หลบหิน นก และหนวดปลาหมึก — เก็บเหรียญ คำศัพท์ และเกาะ">
  <!-- Airplane game tutorial.
       Left (red)  = hazards that END the run on contact.
       Right (green) = pickups that score.
       Every shape below is redrawn from js/game-airplane.js's own draw
       functions using the same fills, so a child sees in the tutorial
       exactly what they'll see in the game:
         rock     drawRock      #6b5847 body, #4a3c2f edge, white foam
         bird     drawBird      #2b2438 body, #F0A500 beak
         tentacle drawTentacle  #5B2C6F arm, #8E44AD suckers
         coin     drawCoins     #FFD700 face, #B8860B rim
         bubble   drawBubble    #fffde7 fill, #f39c12 ring
         island   drawIslands   #E9C46A sand, #2E9E5B palm, #8B5A2B trunk -->
  <defs>
    <clipPath id="seaL"><rect x="12" y="14" width="140" height="104" rx="12"/></clipPath>
    <clipPath id="seaR"><rect x="168" y="14" width="140" height="104" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="320" height="205" rx="18" fill="#EEF9F8"/>

  <!-- ── AVOID ───────────────────────────────────────────────── -->
  <g clip-path="url(#seaL)">
    <rect x="12" y="14" width="140" height="104" fill="#BFE6F2"/>
    <rect x="12" y="14" width="140" height="104" fill="#9FD8EC" opacity="0.45"/>
    <path d="M12 96 q35 -7 70 0 t70 0 v22 H12z" fill="#8ECFE6" opacity="0.5"/>
  </g>
  <rect x="12" y="14" width="140" height="104" rx="12" fill="none" stroke="#E53935" stroke-width="3"/>

  <!-- rock -->
  <g transform="translate(43,68)">
    <ellipse cx="0" cy="12" rx="23" ry="8" fill="#ffffff" opacity="0.55"/>
    <polygon points="15,0 6,10 11,17 0,15 -9,19 -12,6 -20,-3 -7,-8 -3,-19 8,-11"
             fill="#6b5847" stroke="#4a3c2f" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="-6" cy="-6" r="7" fill="#8a7460" opacity="0.6"/>
  </g>
  <!-- bird -->
  <g transform="translate(82,54)">
    <ellipse cx="0" cy="0" rx="5" ry="9" fill="#2b2438"/>
    <polygon points="0,-4 -20,-12 -2,4" fill="#2b2438"/>
    <polygon points="0,-4 20,-12 2,4" fill="#2b2438"/>
    <polygon points="-3,-9 3,-9 0,-15" fill="#F0A500"/>
  </g>
  <!-- tentacle -->
  <g transform="translate(120,92)">
    <path d="M0 0 L2 -12 L7 -23 L15 -33" fill="none" stroke="#5B2C6F"
          stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="2" cy="-12" r="2.6" fill="#8E44AD"/>
    <circle cx="7" cy="-23" r="2.6" fill="#8E44AD"/>
    <circle cx="15" cy="-33" r="6" fill="#5B2C6F"/>
  </g>

  <!-- cross badge -->
  <circle cx="145" cy="21" r="13" fill="#E53935"/>
  <path d="M139 15 L151 27 M151 15 L139 27" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>

  <!-- ── COLLECT ─────────────────────────────────────────────── -->
  <g clip-path="url(#seaR)">
    <rect x="168" y="14" width="140" height="104" fill="#BFE6F2"/>
    <rect x="168" y="14" width="140" height="104" fill="#9FD8EC" opacity="0.45"/>
    <path d="M168 96 q35 -7 70 0 t70 0 v22 H168z" fill="#8ECFE6" opacity="0.5"/>
  </g>
  <rect x="168" y="14" width="140" height="104" rx="12" fill="none" stroke="#27AE60" stroke-width="3"/>

  <!-- coins -->
  <g>
    <circle cx="196" cy="44" r="11" fill="#B8860B"/>
    <circle cx="196" cy="43" r="9.5" fill="#FFD700" stroke="#E8A400" stroke-width="1"/>
    <ellipse cx="193" cy="40" rx="3" ry="2" fill="#fff2a8" opacity="0.9"/>
    <circle cx="196" cy="68" r="11" fill="#B8860B"/>
    <circle cx="196" cy="67" r="9.5" fill="#FFD700" stroke="#E8A400" stroke-width="1"/>
    <ellipse cx="193" cy="64" rx="3" ry="2" fill="#fff2a8" opacity="0.9"/>
  </g>
  <!-- word bubble -->
  <g transform="translate(238,56)">
    <circle cx="0" cy="0" r="26" fill="#ffd700" opacity="0.28"/>
    <circle cx="0" cy="0" r="20" fill="#fffde7" stroke="#f39c12" stroke-width="3"/>
    <circle cx="0" cy="0" r="13" fill="#ffec6e" opacity="0.45"/>
    <text x="0" y="6" text-anchor="middle" font-family="Prompt, sans-serif"
          font-size="15" font-weight="700" fill="#8a5a2b">ก</text>
  </g>
  <!-- island -->
  <g transform="translate(285,84)">
    <ellipse cx="0" cy="10" rx="24" ry="8" fill="#ffffff" opacity="0.35"/>
    <path d="M-22 10 q22 -16 44 0z" fill="#E9C46A"/>
    <path d="M-22 10 q22 -16 44 0z" fill="#D4A94A" opacity="0.45"/>
    <path d="M0 4 L0 -12" stroke="#8B5A2B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-7" cy="-15" r="7" fill="#2E9E5B"/>
    <circle cx="7"  cy="-15" r="7" fill="#2E9E5B"/>
    <circle cx="0"  cy="-20" r="7" fill="#2E9E5B"/>
  </g>

  <!-- tick badge -->
  <circle cx="301" cy="21" r="13" fill="#27AE60"/>
  <path d="M295 21 L299.5 26 L308 16" stroke="#fff" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- ── Thai captions ───────────────────────────────────────── -->
  <text x="82" y="139" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="14" font-weight="700" fill="#E53935">ห้ามชน! หลบให้พ้น</text>
  <text x="82" y="157" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11.5" fill="#7a6f80">หิน · นก · หนวดปลาหมึก</text>
  <text x="82" y="173" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11" fill="#9a90a4">ชนแล้วจบเกมทันที</text>

  <text x="238" y="139" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="14" font-weight="700" fill="#27AE60">เก็บเลย! ได้แต้ม</text>
  <text x="238" y="157" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11.5" fill="#7a6f80">เหรียญ · คำศัพท์ · เกาะ</text>
  <text x="238" y="173" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11" fill="#9a90a4">เก็บคำศัพท์แล้วได้ฝึกพูด</text>

  <line x1="160" y1="24" x2="160" y2="180" stroke="#D8F0EE" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- control reminder -->
  <text x="160" y="196" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11.5" fill="#5b5170">☝️ กดค้างแล้วลากนิ้วเพื่อบังคับเครื่องบิน</text>
</svg>
