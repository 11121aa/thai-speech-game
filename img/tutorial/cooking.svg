<svg viewBox="0 0 320 205" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="เลือกเมนู ทำตามขั้นตอน หั่น สับ ประกอบ แล้วฝึกพูดทุกขั้น">
  <!-- Cooking tutorial: pick a dish, then work through its steps.
       Five dishes exist (hot dog free; pizza, breakfast, burger, fries are
       shop unlocks) and each step is its own little action — drag to cut,
       tap to chop, tap to drop, tap to time. Colours from
       js/game-cooking.js: panel #7B3F10, bun #EFAE55, tomato #EB4B36,
       cabbage #3FC17B, knife #E7ECF2 with #C0392B grip, outline #3D2010. -->
  <rect x="0" y="0" width="320" height="205" rx="18" fill="#EEF9F8"/>

  <!-- STEP 1: choose a dish -->
  <rect x="14" y="18" width="92" height="76" rx="11" fill="#4A2E1B"/>
  <circle cx="26" cy="29" r="9" fill="#F0A500"/>
  <text x="26" y="33" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11" font-weight="700" fill="#2B1B10">1</text>
  <g>
    <rect x="24" y="42" width="34" height="40" rx="7" fill="#7B3F10"/>
    <text x="41" y="68" text-anchor="middle" font-size="20">🌭</text>
    <rect x="62" y="42" width="34" height="40" rx="7" fill="#7B3F10"/>
    <text x="79" y="68" text-anchor="middle" font-size="20">🍕</text>
  </g>
  <text x="60" y="108" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="12" font-weight="700" fill="#8a5a2b">เลือกเมนู</text>

  <path d="M110 56 L124 56" stroke="#D8C4B0" stroke-width="3" stroke-linecap="round"/>
  <path d="M120 51 L126 56 L120 61" fill="none" stroke="#D8C4B0" stroke-width="3" stroke-linecap="round"/>

  <!-- STEP 2: do the action -->
  <rect x="130" y="18" width="92" height="76" rx="11" fill="#4A2E1B"/>
  <circle cx="142" cy="29" r="9" fill="#F0A500"/>
  <text x="142" y="33" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11" font-weight="700" fill="#2B1B10">2</text>
  <!-- tomato being chopped -->
  <circle cx="170" cy="66" r="17" fill="#EB4B36" stroke="#3D2010" stroke-width="2"/>
  <ellipse cx="170" cy="50" rx="6" ry="3" fill="#3FC17B"/>
  <!-- knife -->
  <g transform="translate(199,44) rotate(24)">
    <rect x="-4" y="0" width="8" height="20" rx="2" fill="#C0392B" stroke="#3D2010" stroke-width="1.5"/>
    <polygon points="-4,0 4,0 2.5,-26 0,-31 -2.5,-26" fill="#E7ECF2" stroke="#3D2010" stroke-width="1.5"/>
  </g>
  <path d="M186 74 l7 6 M191 68 l7 6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <text x="176" y="108" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="12" font-weight="700" fill="#8a5a2b">หั่น · สับ · ประกอบ</text>

  <path d="M226 56 L240 56" stroke="#D8C4B0" stroke-width="3" stroke-linecap="round"/>
  <path d="M236 51 L242 56 L236 61" fill="none" stroke="#D8C4B0" stroke-width="3" stroke-linecap="round"/>

  <!-- STEP 3: practise -->
  <rect x="246" y="18" width="60" height="76" rx="11" fill="#4A2E1B"/>
  <circle cx="258" cy="29" r="9" fill="#F0A500"/>
  <text x="258" y="33" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11" font-weight="700" fill="#2B1B10">3</text>
  <circle cx="276" cy="64" r="19" fill="#E53935"/>
  <rect x="272" y="55" width="8" height="12" rx="4" fill="#ffffff"/>
  <path d="M268 66 a8 8 0 0 0 16 0" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M276 74 v4" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="276" y="108" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="12" font-weight="700" fill="#8a5a2b">ฝึกพูด</text>

  <rect x="14" y="120" width="292" height="44" rx="10" fill="#ffffff" stroke="#D8F0EE" stroke-width="2"/>
  <text x="160" y="136" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11.5" fill="#5b5170">ทำตามขั้นตอนบนแถบด้านบน ทีละขั้นจนครบ</text>
  <text x="160" y="152" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11.5" fill="#5b5170">จบแต่ละขั้นจะได้คะแนน แล้วได้ฝึกออกเสียงคำ</text>

  <text x="160" y="180" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11" fill="#9a90a4">🌭 ฮอทดอกเล่นได้เลย · 🍕 🍳 🍔 🍟 ซื้อเพิ่มในร้านค้า</text>
  <text x="160" y="196" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11.5" font-weight="700" fill="#13726a">ยิ่งทำแม่นยำ ยิ่งได้คะแนนมาก</text>
</svg>
