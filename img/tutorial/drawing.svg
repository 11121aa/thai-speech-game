<svg viewBox="0 0 320 205" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="เริ่มที่จุดเขียว ลากนิ้วตามเส้นประรอบรูป ครบแล้วรูปจะมีสี แล้วฝึกพูดคำนั้น">
  <!-- Drawing-game tutorial, left to right: the dashed outline with its
       green start dot, a finger part-way round it, and the filled-in
       picture you get for going all the way. Colours are the ones the
       game actually uses (js/game-drawing.js): guide #b9a68c,
       trail #2EC4B6, start dot #27AE60, paper #fdf6e8. -->
  <rect width="320" height="205" rx="10" fill="#fdf6e8"/>

  <!-- 1 — the outline, waiting to be traced -->
  <g transform="translate(14,34)">
    <path d="M42 8c20 0 38 16 38 36S62 86 42 86 4 66 4 44 22 8 42 8z"
          fill="none" stroke="#b9a68c" stroke-width="5" stroke-dasharray="7 9" stroke-linecap="round"/>
    <circle cx="42" cy="8" r="8" fill="#27ae60" stroke="#ffffff" stroke-width="3"/>
    <text x="42" y="108" font-family="Prompt, sans-serif" font-size="12"
          fill="#7a6a58" text-anchor="middle">เริ่มที่จุดเขียว</text>
  </g>

  <!-- 2 — a finger half-way round, trail behind it -->
  <g transform="translate(118,34)">
    <path d="M42 8c20 0 38 16 38 36S62 86 42 86 4 66 4 44 22 8 42 8z"
          fill="none" stroke="#b9a68c" stroke-width="5" stroke-dasharray="7 9" stroke-linecap="round"/>
    <path d="M42 8c20 0 38 16 38 36 0 13-8 26-20 33"
          fill="none" stroke="#2ec4b6" stroke-width="7" stroke-linecap="round"/>
    <!-- the hand, same shape as the in-game gesture hint -->
    <g transform="translate(48,70) scale(.62)" fill="#2b2438" stroke="#2b2438"
       stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
      <rect x="10" y="30" width="27" height="17" rx="7"/>
      <path d="M18 33V9" fill="none"/>
      <path d="M12 35l-7-6" fill="none"/>
    </g>
    <g transform="translate(48,70) scale(.62)" fill="#ffffff" stroke="#ffffff"
       stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <rect x="10" y="30" width="27" height="17" rx="7"/>
      <path d="M18 33V9" fill="none"/>
      <path d="M12 35l-7-6" fill="none"/>
    </g>
    <text x="42" y="108" font-family="Prompt, sans-serif" font-size="12"
          fill="#7a6a58" text-anchor="middle">ลากตามเส้นประ</text>
  </g>

  <!-- 3 — finished: the picture fills in and the word is practised -->
  <g transform="translate(222,34)">
    <path d="M42 8c20 0 38 16 38 36S62 86 42 86 4 66 4 44 22 8 42 8z"
          fill="#ffd9a0" stroke="#2ec4b6" stroke-width="7" stroke-linecap="round"/>
    <text x="42" y="56" font-family="Prompt, sans-serif" font-size="30"
          text-anchor="middle">🍎</text>
    <text x="78" y="14" font-family="Prompt, sans-serif" font-size="20"
          text-anchor="middle">⭐</text>
    <text x="42" y="108" font-family="Prompt, sans-serif" font-size="12"
          fill="#7a6a58" text-anchor="middle">ครบแล้ว — ฝึกพูด</text>
  </g>
</svg>
