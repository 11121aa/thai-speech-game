<svg viewBox="0 0 320 205" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ดูภาพแล้วเลือกคำที่ตรงกับภาพจากสามตัวเลือก">
  <!-- Flashcard tutorial. Per js/game-flashcard.js the card shows one big
       picture and THREE word choices in random order — there is no hint
       and no listen button, the word itself is the answer. So the diagram
       shows the card with three buttons, the right one ticked and a wrong
       one crossed, rather than any kind of "reveal". Colours: card #ffffff
       on #f5f3ff, borders #d8d3e8, accent #2ec4b6, wrong #ef4444. -->
  <rect x="0" y="0" width="320" height="205" rx="18" fill="#EEF9F8"/>

  <!-- the card -->
  <rect x="16" y="16" width="150" height="122" rx="12" fill="#ffffff" stroke="#d8d3e8" stroke-width="2.5"/>
  <rect x="26" y="26" width="130" height="62" rx="9" fill="#f0fafa"/>
  <text x="91" y="72" text-anchor="middle" font-size="38">🐟</text>
  <text x="91" y="106" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11.5" fill="#8a8496">ดูภาพนี้</text>
  <text x="91" y="126" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="12" font-weight="700" fill="#2ec4b6">แล้วเลือกคำที่ถูก</text>

  <!-- the three choices -->
  <g font-family="Prompt, sans-serif" font-size="13" font-weight="700">
    <!-- wrong -->
    <rect x="182" y="20" width="104" height="30" rx="15" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="228" y="40" text-anchor="middle" fill="#b91c1c">นก</text>
    <g transform="translate(296,35)">
      <circle cx="0" cy="0" r="10" fill="#ef4444"/>
      <path d="M-4.5 -4.5 L4.5 4.5 M4.5 -4.5 L-4.5 4.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
    </g>

    <!-- correct -->
    <rect x="182" y="58" width="104" height="30" rx="15" fill="#dcfce7" stroke="#27AE60" stroke-width="2.5"/>
    <text x="228" y="78" text-anchor="middle" fill="#15803d">ปลา</text>
    <g transform="translate(296,73)">
      <circle cx="0" cy="0" r="10" fill="#27AE60"/>
      <path d="M-4.5 0 L-1 3.5 L5 -4" stroke="#fff" stroke-width="2.6"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- neutral third option -->
    <rect x="182" y="96" width="104" height="30" rx="15" fill="#ffffff" stroke="#d8d3e8" stroke-width="2"/>
    <text x="228" y="116" text-anchor="middle" fill="#6b647a">หมู</text>
  </g>

  <text x="234" y="140" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11" fill="#8a8496">มี 3 ตัวเลือกทุกครั้ง</text>

  <rect x="14" y="148" width="292" height="30" rx="10" fill="#ffffff" stroke="#D8F0EE" stroke-width="2"/>
  <text x="160" y="168" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11.5" fill="#5b5170">เลือกถูก = ได้ฝึกออกเสียงคำนั้น แล้วไปการ์ดใบต่อไป</text>

  <text x="160" y="195" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="12" font-weight="700" fill="#13726a">🎴 ทำให้ได้มากที่สุดก่อนเวลาหมด</text>
</svg>
