<svg viewBox="0 0 320 205" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="แตะช่องเสื้อผ้า เลือกชิ้นที่ชอบ พูดคำให้ถูกแล้วจะได้ใส่">
  <!-- Dress-up tutorial: pick a slot tab, tap an item, then the practice
       popup gates the equip — the piece only goes on after the word is
       said. Colours from js/game-dressup.js: warm bg #FFF7EC, ground
       #F3E4C8, skin #F5C9A0, accent #2ec4b6, card border #e5e7eb. -->
  <rect x="0" y="0" width="320" height="205" rx="18" fill="#EEF9F8"/>
  <rect x="12" y="14" width="296" height="104" rx="12" fill="#FFF7EC" stroke="#F0E0C8" stroke-width="2"/>
  <rect x="12" y="100" width="296" height="18" rx="0" fill="#F3E4C8"/>

  <!-- the doll -->
  <g transform="translate(56,0)">
    <circle cx="0" cy="46" r="15" fill="#F5C9A0"/>
    <circle cx="-5" cy="44" r="1.8" fill="#2b2b2b"/><circle cx="5" cy="44" r="1.8" fill="#2b2b2b"/>
    <path d="M-4 51 a4 4 0 0 0 8 0" fill="none" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="-13" y="60" width="26" height="28" rx="7" fill="#2ec4b6"/>
    <rect x="-11" y="88" width="9" height="14" rx="3" fill="#8A5CF6"/>
    <rect x="2"  y="88" width="9" height="14" rx="3" fill="#8A5CF6"/>
  </g>
  <text x="56" y="24" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11" font-weight="700" fill="#a08050">ตุ๊กตาของคุณ</text>

  <!-- slot tabs -->
  <g font-size="15">
    <rect x="104" y="22" width="30" height="26" rx="8" fill="#2ec4b6"/>
    <text x="119" y="41" text-anchor="middle">🎩</text>
    <rect x="140" y="22" width="30" height="26" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <text x="155" y="41" text-anchor="middle">👕</text>
    <rect x="176" y="22" width="30" height="26" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <text x="191" y="41" text-anchor="middle">👖</text>
    <rect x="212" y="22" width="30" height="26" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <text x="227" y="41" text-anchor="middle">👟</text>
    <rect x="248" y="22" width="30" height="26" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <text x="263" y="41" text-anchor="middle">👜</text>
  </g>
  <circle cx="107" cy="20" r="8" fill="#F0A500"/>
  <text x="107" y="24" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="10" font-weight="700" fill="#3D2010">1</text>

  <!-- item cards for that slot -->
  <g>
    <rect x="104" y="56" width="40" height="40" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <text x="124" y="82" text-anchor="middle" font-size="19">🎩</text>
    <rect x="150" y="56" width="40" height="40" rx="8" fill="#ffffff" stroke="#2ec4b6" stroke-width="3"/>
    <text x="170" y="82" text-anchor="middle" font-size="19">👑</text>
    <text x="170" y="102" text-anchor="middle" font-size="14">☝️</text>
    <rect x="196" y="56" width="40" height="40" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <text x="216" y="82" text-anchor="middle" font-size="19">🧢</text>
    <rect x="242" y="56" width="40" height="40" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <text x="262" y="82" text-anchor="middle" font-size="19">🎓</text>
  </g>
  <circle cx="153" cy="54" r="8" fill="#F0A500"/>
  <text x="153" y="58" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="10" font-weight="700" fill="#3D2010">2</text>

  <!-- gate: say the word first -->
  <rect x="14" y="126" width="292" height="40" rx="10" fill="#ffffff" stroke="#2ec4b6" stroke-width="2.5"/>
  <circle cx="36" cy="146" r="13" fill="#E53935"/>
  <rect x="32.5" y="140" width="7" height="9" rx="3.5" fill="#ffffff"/>
  <path d="M30 148 a6 6 0 0 0 12 0" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="172" y="142" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="12" font-weight="700" fill="#13726a">3. พูดคำให้ถูกก่อน แล้วจะได้ใส่</text>
  <text x="172" y="157" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="10.5" fill="#8a8496">ทุกครั้งที่ใส่ของ จะมีคำให้ฝึกออกเสียง</text>

  <text x="160" y="182" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11" fill="#9a90a4">ของแต่งตัวซื้อได้ที่ร้านค้า ด้วยเหรียญจากการฝึกพูด</text>
  <text x="160" y="197" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11.5" font-weight="700" fill="#13726a">👗 แต่งได้ตามใจชอบ ไม่มีถูกผิด</text>
</svg>
