<svg viewBox="0 0 320 205" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="แตะหมุน ปัดซ้ายขวาเลื่อน ปัดลงตกทันที เรียงเต็มแถวแถวจะหาย">
  <!-- Tetris tutorial: the three gestures, then what a full row does.
       Piece colours are the real ones from js/game-tetris.js:
       I #2EC4B6, O #F0A500, T #8A5CF6, S #27AE60, Z #E53935,
       J #2196F3, L #FF9F1C; board background #1e2a40. -->
  <rect x="0" y="0" width="320" height="205" rx="18" fill="#EEF9F8"/>

  <!-- board with a nearly-complete row -->
  <rect x="14" y="16" width="118" height="122" rx="10" fill="#1e2a40"/>
  <g>
    <!-- falling T piece -->
    <rect x="56" y="30" width="16" height="16" rx="3" fill="#8A5CF6"/>
    <rect x="40" y="46" width="16" height="16" rx="3" fill="#8A5CF6"/>
    <rect x="56" y="46" width="16" height="16" rx="3" fill="#8A5CF6"/>
    <rect x="72" y="46" width="16" height="16" rx="3" fill="#8A5CF6"/>
    <!-- settled blocks -->
    <rect x="22" y="104" width="16" height="16" rx="3" fill="#2196F3"/>
    <rect x="38" y="104" width="16" height="16" rx="3" fill="#FF9F1C"/>
    <rect x="54" y="104" width="16" height="16" rx="3" fill="#27AE60"/>
    <rect x="70" y="104" width="16" height="16" rx="3" fill="#E53935"/>
    <rect x="86" y="104" width="16" height="16" rx="3" fill="#2EC4B6"/>
    <rect x="102" y="104" width="16" height="16" rx="3" fill="#F0A500"/>
    <!-- the row about to complete: one gap -->
    <rect x="22" y="120" width="16" height="16" rx="3" fill="#F0A500"/>
    <rect x="38" y="120" width="16" height="16" rx="3" fill="#8A5CF6"/>
    <rect x="54" y="120" width="16" height="16" rx="3" fill="#2196F3"/>
    <rect x="70" y="120" width="16" height="16" rx="3" fill="none" stroke="#7d8aa5" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="86" y="120" width="16" height="16" rx="3" fill="#27AE60"/>
    <rect x="102" y="120" width="16" height="16" rx="3" fill="#FF9F1C"/>
  </g>
  <text x="73" y="152" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11" fill="#5b5170">เติมช่องที่ยังว่าง</text>

  <!-- the three gestures -->
  <g>
    <rect x="144" y="16" width="162" height="34" rx="9" fill="#ffffff" stroke="#D8F0EE" stroke-width="2"/>
    <text x="160" y="38" font-size="15">☝️</text>
    <text x="184" y="30" font-family="Prompt, sans-serif" font-size="12" font-weight="700" fill="#8A5CF6">แตะ = หมุนบล็อก</text>
    <text x="184" y="43" font-family="Prompt, sans-serif" font-size="10" fill="#8a8496">แตะที่ไหนก็ได้บนกระดาน</text>

    <rect x="144" y="56" width="162" height="34" rx="9" fill="#ffffff" stroke="#D8F0EE" stroke-width="2"/>
    <text x="158" y="78" font-size="14">↔️</text>
    <text x="184" y="70" font-family="Prompt, sans-serif" font-size="12" font-weight="700" fill="#2196F3">ปัดซ้าย/ขวา = เลื่อน</text>
    <text x="184" y="83" font-family="Prompt, sans-serif" font-size="10" fill="#8a8496">ลากค้างเลื่อนได้หลายช่อง</text>

    <rect x="144" y="96" width="162" height="34" rx="9" fill="#ffffff" stroke="#D8F0EE" stroke-width="2"/>
    <text x="159" y="118" font-size="14">⬇️</text>
    <text x="184" y="110" font-family="Prompt, sans-serif" font-size="12" font-weight="700" fill="#E53935">ปัดลง = ตกทันที</text>
    <text x="184" y="123" font-family="Prompt, sans-serif" font-size="10" fill="#8a8496">วางเร็วขึ้น ได้บล็อกใหม่เลย</text>
  </g>

  <!-- what a full row does -->
  <rect x="144" y="138" width="162" height="30" rx="9" fill="#dcfce7" stroke="#27AE60" stroke-width="2"/>
  <text x="225" y="150" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11" font-weight="700" fill="#15803d">เรียงเต็มแถว = แถวหาย</text>
  <text x="225" y="163" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="10" fill="#3f7a55">ได้ 200 คะแนนต่อแถว</text>

  <text x="160" y="184" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="11.5" font-weight="700" fill="#13726a">🎤 ทุก 1,000 คะแนน จะได้ฝึกออกเสียงคำ</text>
  <text x="160" y="198" text-anchor="middle" font-family="Prompt, sans-serif"
        font-size="10.5" fill="#9a90a4">ถ้าบล็อกกองสูงจนถึงขอบบน = จบเกม</text>
</svg>
