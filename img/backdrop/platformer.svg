<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <!-- Hover backdrop for the game-select screen. Deliberately low
       detail and low contrast: it sits behind the whole page at partial
       opacity, so it has to read as atmosphere at a glance and never
       compete with the cards or text on top of it. -->
  <rect width="1200" height="700" fill="#cfeaf7"/>
  <circle cx="200" cy="130" r="60" fill="#ffe9a8" opacity="0.8"/>
  <path d="M0 430 q200 -140 400 0 t400 0 t400 0 v270 H0z" fill="#7fc97f" opacity="0.55"/>
  <path d="M0 520 q240 -110 480 0 t480 0 t480 0 v180 H0z" fill="#4caf50" opacity="0.65"/>
  <rect y="600" width="1200" height="100" fill="#795548" opacity="0.85"/>
  <rect y="600" width="1200" height="14" fill="#8d6e63"/>
  <g fill="#795548" opacity="0.7">
    <rect x="250" y="480" width="150" height="22" rx="8"/>
    <rect x="560" y="410" width="150" height="22" rx="8"/>
    <rect x="870" y="470" width="150" height="22" rx="8"/>
  </g>
</svg>
