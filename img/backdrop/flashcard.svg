<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <!-- Hover backdrop for the game-select screen. Deliberately low
       detail and low contrast: it sits behind the whole page at partial
       opacity, so it has to read as atmosphere at a glance and never
       compete with the cards or text on top of it. -->
  <rect width="1200" height="700" fill="#fff1de"/>
  <g opacity="0.5">
    <rect x="120" y="150" width="220" height="150" rx="20" fill="#ffffff" stroke="#ff9f1c" stroke-width="5" transform="rotate(-7 230 225)"/>
    <rect x="480" y="330" width="220" height="150" rx="20" fill="#ffffff" stroke="#ff9f1c" stroke-width="5" transform="rotate(4 590 405)"/>
    <rect x="850" y="140" width="220" height="150" rx="20" fill="#ffffff" stroke="#ff9f1c" stroke-width="5" transform="rotate(9 960 215)"/>
  </g>
  <g fill="#e8870a" opacity="0.35">
    <circle cx="230" cy="225" r="34"/><circle cx="590" cy="405" r="34"/><circle cx="960" cy="215" r="34"/>
  </g>
</svg>
