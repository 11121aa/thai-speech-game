<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <!-- Hover backdrop for the game-select screen. Deliberately low
       detail and low contrast: it sits behind the whole page at partial
       opacity, so it has to read as atmosphere at a glance and never
       compete with the cards or text on top of it. -->
  <rect width="1200" height="700" fill="#dcecc6"/>
  <path d="M-30 130 H360 V420 H760 V190 H1030 V560 H1230" fill="none" stroke="#c9a227" stroke-width="72" stroke-linejoin="round" opacity="0.75"/>
  <path d="M-30 130 H360 V420 H760 V190 H1030 V560 H1230" fill="none" stroke="#e3c463" stroke-width="48" stroke-linejoin="round" opacity="0.9"/>
  <g opacity="0.55">
    <circle cx="500" cy="300" r="34" fill="#2EC4B6"/>
    <circle cx="880" cy="360" r="34" fill="#E53935"/>
    <circle cx="240" cy="300" r="34" fill="#6D4C41"/>
  </g>
  <rect x="1120" y="520" width="70" height="80" rx="12" fill="#27AE60" opacity="0.75"/>
  <circle cx="30" cy="130" r="34" fill="#8E44AD" opacity="0.6"/>
</svg>
