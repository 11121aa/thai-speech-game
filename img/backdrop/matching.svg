<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <!-- Hover backdrop for the game-select screen. Deliberately low
       detail and low contrast: it sits behind the whole page at partial
       opacity, so it has to read as atmosphere at a glance and never
       compete with the cards or text on top of it. -->
  <rect width="1200" height="700" fill="#efe7fd"/>
  <g fill="#8a5cf6" opacity="0.16">
    <rect x="90" y="120" width="120" height="165" rx="16" transform="rotate(-9 150 200)"/>
    <rect x="300" y="330" width="120" height="165" rx="16" transform="rotate(7 360 410)"/>
    <rect x="560" y="110" width="120" height="165" rx="16" transform="rotate(-4 620 190)"/>
    <rect x="800" y="380" width="120" height="165" rx="16" transform="rotate(11 860 460)"/>
    <rect x="1010" y="150" width="120" height="165" rx="16" transform="rotate(-6 1070 230)"/>
    <rect x="150" y="470" width="120" height="165" rx="16" transform="rotate(5 210 550)"/>
  </g>
  <g fill="#13726a" opacity="0.12">
    <circle cx="150" cy="200" r="26"/><circle cx="620" cy="190" r="26"/>
    <circle cx="360" cy="410" r="26"/><circle cx="860" cy="460" r="26"/>
  </g>
</svg>
