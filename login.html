<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ | แบบฝึกหัดฝึกพูดสำหรับเด็กพูดไม่ชัด</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Mali:wght@500;600&display=swap" rel="stylesheet">
<link href="css/kid-b.css?v=1" rel="stylesheet">
</head>
<body class="lg-page ui-b">

<header class="lg-art">
  <div class="kb-scenery" aria-hidden="true"><div class="kb-sun"></div><div class="kb-cloud" style="--w:96px;left:8%;top:90px"></div><div class="kb-cloud" style="--w:70px;left:70%;top:160px;opacity:.8"></div><div class="kb-hill kb-hill-1"></div><div class="kb-hill kb-hill-2"></div></div>
  <a class="lg-back" href="game.html" aria-label="กลับหน้าแรก"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path class="ic-l" d="M15 5l-7 7 7 7"/></svg></a>
  <span class="kb-owl" aria-hidden="true"></span>
</header>

<main class="lg-main">
  <div class="lg-form">
    <div class="lg-card kb-board"><div class="kb-board-in"><h1 class="kb-hand lg-title">มาเล่นกันเถอะ!</h1>
      <!-- shown only when user arrives via password-reset email -->
      <div id="resetSection" style="display:none;">
        <h2 class="h4 text-center mb-4">ตั้งรหัสผ่านใหม่</h2>
        <form id="resetForm">
          <div class="mb-3">
            <label class="form-label fw-semibold">รหัสผ่านใหม่</label>
            <input type="password" class="form-control" id="resetPassword" required minlength="6">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">ยืนยันรหัสผ่านใหม่</label>
            <input type="password" class="form-control" id="resetPasswordConfirm" required minlength="6">
          </div>
          <div class="alert alert-danger" id="resetError" style="display:none;"></div>
          <div class="alert alert-success" id="resetSuccess" style="display:none;"></div>
          <button type="submit" class="btn lg-submit">บันทึกรหัสผ่านใหม่</button>
        </form>
      </div>

      <div id="loginRegisterTabs">
      <ul class="nav lg-tabs" id="authTabs">
        <li class="nav-item">
          <button class="nav-link active" id="tabLoginBtn" data-bs-toggle="pill" data-bs-target="#tabLogin" type="button">เข้าสู่ระบบ</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="tabRegisterBtn" data-bs-toggle="pill" data-bs-target="#tabRegister" type="button">ลงทะเบียน</button>
        </li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="tabLogin">
          
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label fw-semibold">ชื่อผู้ใช้</label>
              <input type="text" class="form-control" id="loginUsername" autocomplete="username" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">รหัสผ่าน</label>
              <input type="password" class="form-control" id="loginPassword" autocomplete="current-password" required>
            </div>
            <div class="alert alert-danger" id="loginError" style="display:none;"></div>
            <button type="submit" class="btn lg-submit">เข้าสู่ระบบ</button>
            <div class="text-center mt-3">
              <button type="button" class="btn btn-link btn-sm p-0 text-muted" id="forgotToggle">ลืมรหัสผ่าน?</button>
            </div>
          </form>

          <div id="forgotSection" style="display:none;" class="mt-3 border-top pt-3">
            <p class="small text-muted mb-2">กรอกชื่อผู้ใช้ของคุณ — หากบัญชีมีอีเมลสำหรับกู้คืนรหัสผ่านผูกไว้ เราจะส่งลิงก์ไปให้</p>
            <form id="forgotForm">
              <div class="mb-3">
                <label class="form-label fw-semibold">ชื่อผู้ใช้</label>
                <input type="text" class="form-control" id="forgotUsername" required>
              </div>
              <div class="alert alert-danger" id="forgotError" style="display:none;"></div>
              <div class="alert alert-success" id="forgotSuccess" style="display:none;"></div>
              <button type="submit" class="btn btn-outline-secondary w-100">ส่งลิงก์รีเซ็ตรหัสผ่าน</button>
            </form>
          </div>
        </div>

        <div class="tab-pane fade" id="tabRegister">
          
          <form id="registerForm">
            <div class="mb-3">
              <label class="form-label fw-semibold">ชื่อผู้ใช้</label>
              <input type="text" class="form-control" id="registerUsername" autocomplete="username" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">อีเมลสำหรับกู้คืนรหัสผ่าน <span class="text-secondary fw-normal">(ไม่บังคับ)</span></label>
              <input type="email" class="form-control" id="registerRecoveryEmail" placeholder="กรอกไว้เผื่อลืมรหัสผ่าน">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">รหัสผ่าน</label>
              <input type="password" class="form-control" id="registerPassword" autocomplete="new-password" required minlength="6">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">ยืนยันรหัสผ่าน</label>
              <input type="password" class="form-control" id="registerPasswordConfirm" autocomplete="new-password" required minlength="6">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">สมัครในฐานะ</label>
              <div class="d-flex gap-3">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="registerRole" id="roleUser" value="user" checked>
                  <label class="form-check-label" for="roleUser">ผู้ฝึกออกเสียง</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="registerRole" id="roleSpecialist" value="specialist">
                  <label class="form-check-label" for="roleSpecialist">นักแก้ไขการพูด</label>
                </div>
              </div>
            </div>
            <div id="patientExtraFields" class="row g-3 mb-3">
              <div class="col-6">
                <label class="form-label fw-semibold">เพศ</label>
                <select class="form-select" id="registerGender" required>
                  <option value="">เลือก...</option>
                  <option value="male">ชาย</option>
                  <option value="female">หญิง</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label fw-semibold">อายุ</label>
                <input type="number" class="form-control" id="registerAge" min="1" max="120" required>
              </div>
            </div>
            <div class="alert alert-danger" id="registerError" style="display:none;"></div>
            <div class="alert alert-success" id="registerSuccess" style="display:none;"></div>
            <button type="submit" class="btn lg-submit">ลงทะเบียน</button>
          </form>
        </div>
      </div>
      </div><!-- /loginRegisterTabs -->
      </div>
    </div>
  </div>
</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=2-free"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js?v=2"></script>
<script src="js/main.js"></script>
<script src="js/kid-icons.js?v=1"></script>
<script src="js/kid-art-b.js?v=1"></script>
<script>document.querySelectorAll(".kb-owl").forEach(function (o) { o.innerHTML = KidArtB.owl; });</script>
<script>
  const redirectTarget = new URLSearchParams(location.search).get("redirect") || "game.html";

  document.addEventListener("DOMContentLoaded", async function () {
    // Check if this is a password-reset redirect (Supabase puts type=recovery in the URL hash)
    const hashParams = new URLSearchParams(location.hash.slice(1));
    if (hashParams.get("type") === "recovery") {
      document.getElementById("loginRegisterTabs").style.display = "none";
      document.getElementById("resetSection").style.display = "block";
      return;
    }

    const session = await Auth.getSession();
    if (session) {
      location.href = redirectTarget;
      return;
    }
    Auth.initNav();
  });

  // Gender/age are only collected for patient (ผู้ฝึกออกเสียง) sign-ups —
  // hide them (and drop the `required` so the hidden fields can't block
  // submission) when "specialist" is picked instead.
  function updatePatientExtraFields() {
    const isPatient = document.getElementById("roleUser").checked;
    const wrap = document.getElementById("patientExtraFields");
    wrap.style.display = isPatient ? "flex" : "none";
    document.getElementById("registerGender").required = isPatient;
    document.getElementById("registerAge").required = isPatient;
  }
  document.querySelectorAll('input[name="registerRole"]').forEach(function (r) {
    r.addEventListener("change", updatePatientExtraFields);
  });
  updatePatientExtraFields();

  // Toggle forgot-password section
  document.getElementById("forgotToggle").addEventListener("click", function () {
    const sec = document.getElementById("forgotSection");
    const visible = sec.style.display !== "none";
    sec.style.display = visible ? "none" : "block";
    if (!visible) document.getElementById("forgotUsername").focus();
  });

  // Send reset email — resolves the username to its account's underlying
  // Auth email first. Always shows the same neutral success message
  // regardless of whether the username exists or has a recovery email on
  // file, same anti-enumeration principle Supabase's own API follows.
  document.getElementById("forgotForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const errEl = document.getElementById("forgotError");
    const okEl = document.getElementById("forgotSuccess");
    errEl.style.display = "none";
    okEl.style.display = "none";
    const username = document.getElementById("forgotUsername").value.trim();

    const { data: email } = await sb.rpc("username_to_email", { uname: username });
    if (email) {
      await sb.auth.resetPasswordForEmail(email, {
        redirectTo: location.origin + location.pathname
      });
    }
    okEl.textContent = "หากบัญชี \"" + username + "\" มีอีเมลสำหรับกู้คืนรหัสผ่านผูกไว้ เราได้ส่งลิงก์ไปให้แล้ว กรุณาตรวจสอบกล่องจดหมาย";
    okEl.style.display = "block";
    document.getElementById("forgotForm").reset();
  });

  // Set new password (recovery flow)
  document.getElementById("resetForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const errEl = document.getElementById("resetError");
    const okEl = document.getElementById("resetSuccess");
    errEl.style.display = "none";
    okEl.style.display = "none";
    const pwd = document.getElementById("resetPassword").value;
    const confirm = document.getElementById("resetPasswordConfirm").value;
    if (pwd !== confirm) {
      errEl.textContent = "รหัสผ่านทั้งสองช่องไม่ตรงกัน";
      errEl.style.display = "block";
      return;
    }
    const { error } = await sb.auth.updateUser({ password: pwd });
    if (error) {
      errEl.textContent = "เปลี่ยนรหัสผ่านไม่สำเร็จ ลิงก์อาจหมดอายุ กรุณาขอลิงก์ใหม่";
      errEl.style.display = "block";
      return;
    }
    okEl.textContent = "เปลี่ยนรหัสผ่านสำเร็จ กำลังพาไปหน้าหลัก...";
    okEl.style.display = "block";
    setTimeout(function () { location.href = redirectTarget; }, 1800);
  });

  document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const errEl = document.getElementById("loginError");
    errEl.style.display = "none";
    const username = document.getElementById("loginUsername").value.trim();
    const password = document.getElementById("loginPassword").value;

    // signInWithPassword needs the account's actual Auth email, so resolve
    // the typed username to it first (see username_to_email in the SQL
    // migration — also matches an existing email directly, so accounts
    // created before this migration can still log in with their old email).
    const { data: email } = await sb.rpc("username_to_email", { uname: username });
    if (!email) {
      errEl.textContent = "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";
      errEl.style.display = "block";
      return;
    }

    const { data, error } = await sb.auth.signInWithPassword({ email: email, password: password });
    if (error) {
      errEl.textContent = "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";
      errEl.style.display = "block";
      return;
    }

    const role = await Auth.getRole(data.user.id);
    if (!role) {
      await sb.from("role").insert({ user_id: data.user.id, role: "user" });
    }
    await Auth.logActivity("login", "login.html");
    location.href = redirectTarget;
  });

  document.getElementById("registerForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const errEl = document.getElementById("registerError");
    const okEl = document.getElementById("registerSuccess");
    errEl.style.display = "none";
    okEl.style.display = "none";

    const username = document.getElementById("registerUsername").value.trim();
    const recoveryEmail = document.getElementById("registerRecoveryEmail").value.trim();
    const password = document.getElementById("registerPassword").value;
    const confirmPassword = document.getElementById("registerPasswordConfirm").value;
    const role = document.querySelector('input[name="registerRole"]:checked').value;
    const gender = role === "user" ? document.getElementById("registerGender").value : null;
    const age = role === "user" ? parseInt(document.getElementById("registerAge").value, 10) : null;

    if (password !== confirmPassword) {
      errEl.textContent = "รหัสผ่านทั้งสองช่องไม่ตรงกัน";
      errEl.style.display = "block";
      return;
    }

    // Check the username isn't already taken before creating the account.
    const { data: existing } = await sb.rpc("username_to_email", { uname: username });
    if (existing) {
      errEl.textContent = "ชื่อผู้ใช้นี้ถูกใช้แล้ว กรุณาเลือกชื่ออื่น";
      errEl.style.display = "block";
      return;
    }

    // Supabase Auth still requires an email under the hood. If a recovery
    // email was given, use it as the real Auth email (so "forgot password"
    // works); otherwise use a random placeholder that's never shown or
    // emailed — either way, login always happens via username.
    const authEmail = recoveryEmail || (crypto.randomUUID() + "@users.noreply.local");

    const { data, error } = await sb.auth.signUp({ email: authEmail, password: password });
    if (error) {
      errEl.textContent = recoveryEmail
        ? "อีเมลสำหรับกู้คืนรหัสผ่านนี้ถูกใช้แล้ว กรุณาใช้อีเมลอื่นหรือเว้นว่างไว้"
        : (error.message || "ลงทะเบียนไม่สำเร็จ กรุณาลองใหม่");
      errEl.style.display = "block";
      return;
    }

    if (!data.session) {
      okEl.textContent = "ลงทะเบียนสำเร็จ กรุณายืนยันอีเมลก่อนเข้าสู่ระบบ (หากระบบเปิดใช้งานการยืนยันอีเมล)";
      okEl.style.display = "block";
      return;
    }

    const { error: profileError } = await sb.from("profiles").insert({
      user_id: data.user.id, username: username, recovery_email: recoveryEmail || null,
      gender: gender || null, age: (age && !isNaN(age)) ? age : null
    });
    if (profileError) {
      errEl.textContent = "สร้างบัญชีสำเร็จ แต่บันทึกโปรไฟล์ไม่สำเร็จ: " + profileError.message +
        " (อาจยังไม่ได้รัน supabase/username_auth_migration.sql — กรุณาแจ้งผู้ดูแลระบบ)";
      errEl.style.display = "block";
      return;
    }
    await sb.from("role").insert({ user_id: data.user.id, role: role });
    await Auth.logActivity("login", "login.html");
    location.href = redirectTarget;
  });
</script>
</body>
</html>
